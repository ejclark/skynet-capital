name: Deploy

# Continuous deployment: after the CI workflow finishes successfully on `main`
# (i.e. right after you merge a green PR), deploy that same commit to Fly.io.
# A failed or cancelled CI run never triggers a deploy.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-fly
  cancel-in-progress: false

jobs:
  deploy:
    name: fly deploy
    # Only when the triggering CI run passed.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy the exact commit CI validated, not whatever is newest on main.
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Remember the image serving RIGHT NOW so a bad release can be rolled back to it (audit P1).
      # Best-effort: if this fails (first deploy, API hiccup) we still deploy — we just can't
      # auto-roll back, and the smoke failure below still fails the workflow loudly.
      - name: Capture previous image
        id: prev
        continue-on-error: true
        run: |
          IMG=$(flyctl image show -a skynet-capital --json \
            | jq -r 'if type=="array" then .[0] else . end
                     | if .Digest and .Digest != "" then "\(.Registry)/\(.Repository)@\(.Digest)"
                       else "\(.Registry)/\(.Repository):\(.Tag)" end' 2>/dev/null || true)
          echo "image=$IMG" >> "$GITHUB_OUTPUT"
          echo "previous image: ${IMG:-<none — rollback unavailable this run>}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy to Fly
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # The harness that makes zero-human deploys safe: probe the live public surface
      # (/login + /pulse). A release that doesn't serve is not a release.
      - name: Smoke test the release
        id: smoke
        run: bash scripts/smoke.sh https://skynet-capital.fly.dev

      - name: Roll back to previous image
        if: ${{ failure() && steps.smoke.conclusion == 'failure' && steps.prev.outputs.image != '' }}
        run: |
          echo "smoke failed — rolling back to ${{ steps.prev.outputs.image }}"
          flyctl deploy -a skynet-capital --image "${{ steps.prev.outputs.image }}"
          bash scripts/smoke.sh https://skynet-capital.fly.dev
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
