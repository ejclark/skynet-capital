name: Flip a handoff to ready

# ERIC'S ONE-WORD AUTHORIZATION, AS A BUTTON (docs/HANDOFFS.md).
#
# WHY THIS EXISTS: the flip used to mean "edit the README on main and commit". On 2026-08-17 that
# ran straight into commitlint — GitHub's web editor defaults to messages like "Update status from
# draft to ready in README" (no type) and "Fix formatting…" (capitalized subject), both of which the
# gate rejects. So the authorization, the single most important human action in the whole pipeline,
# was blocked by commit-message formatting. This turns it into: Actions → Run workflow → pick a slug.
#
# WHAT IT DOES NOT CHANGE: who authorizes. Dispatching requires repo write access — the same
# permission needed to edit the file — and `github.actor` is recorded in the commit, so the audit
# trail still names a human. The workflow refuses to flip anything whose contract does not validate,
# so a skeleton can never be marked buildable.
#
# WHY A PR AND NOT A DIRECT PUSH: a push made with GITHUB_TOKEN does not trigger other workflows, so
# a direct push would silently skip `handoff-detect` and no issue would ever open. Opening a PR with
# native auto-merge keeps the chain intact — the merge is a real push, detect fires, the issue opens.

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Handoff slug to authorize (the folder name under docs/handoffs/)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  flip:
    name: authorize a handoff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Check the handoff is real, draft, and contract-valid
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          README="docs/handoffs/$SLUG/README.md"
          [ -f "$README" ] || { echo "::error::no handoff at docs/handoffs/$SLUG"; exit 1; }
          CURRENT=$(grep -m1 '^\*\*Status:\*\*' "$README" | sed -E 's/^\*\*Status:\*\* *([a-z]+).*/\1/')
          if [ "$CURRENT" != "draft" ]; then
            echo "::error::$SLUG is '$CURRENT', not 'draft' — nothing to authorize."
            exit 1
          fi
          # Never mark a skeleton buildable: the contract must already be clean.
          node scripts/handoff-scan.mjs --validate

      - name: Flip it, on a branch, as the dispatcher
        id: flip
        env:
          SLUG: ${{ inputs.slug }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          README="docs/handoffs/$SLUG/README.md"
          sed -i -E 's/^(\*\*Status:\*\* *)draft/\1ready/' "$README"
          git config user.name "$ACTOR"
          git config user.email "$ACTOR@users.noreply.github.com"
          BRANCH="flip/$SLUG"
          git checkout -b "$BRANCH"
          git add -- "$README"
          git commit -q -m "docs(handoff): flip $SLUG to ready" \
                        -m "Authorized by @$ACTOR via the flip button (handoff-flip.yml). This is the build trigger."
          git push -u origin "$BRANCH" --force-with-lease
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open the authorization PR and arm auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLUG: ${{ inputs.slug }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ steps.flip.outputs.branch }}
        run: |
          set -euo pipefail
          PR_TITLE="docs(handoff): flip $SLUG to ready"
          PR_BODY=$(printf '%s\n' \
            "**@$ACTOR authorized \`$SLUG\` to build.**" "" \
            "Dispatched from the flip button, so the commit message satisfies commitlint without anyone typing one." "" \
            "On merge: \`handoff-detect\` opens the \`[handoff] $SLUG\` issue, a pickup layer claims it, and its first commit flips \`ready\` → \`executing\` — that flip is the lock." "" \
            "---" "_Opened automatically by \`.github/workflows/handoff-flip.yml\`._")
          # DEGRADE HONESTLY (docs/LESSONS.md 2026-08-17). "Allow GitHub Actions to create and
          # approve pull requests" is OFF by default on every GitHub repo. When it is off, everything
          # above has already succeeded — branch pushed, commit made — and only this last call fails.
          # Stranding that behind a raw error is the "did all the work, then died" shape, so: name the
          # cause, hand over the compare URL, and exit 0. Nothing is lost; a human finishes it.
          COMPARE="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$BRANCH?expand=1"
          if ! PR_URL=$(gh pr create --base main --head "$BRANCH" --title "$PR_TITLE" --body "$PR_BODY" 2>/tmp/pr-err.txt); then
            if grep -q "not permitted to create or approve pull requests" /tmp/pr-err.txt; then
              MSG=$(printf '%s\n' \
                "⚠️ The branch is pushed and the work is safe, but this workflow could not open the PR:" \
                "**GitHub Actions is not permitted to create or approve pull requests** in this repo." "" \
                "**Open it here:** $COMPARE" "" \
                "**To stop this recurring:** Settings → Actions → General → Workflow permissions →" \
                "tick *Allow GitHub Actions to create and approve pull requests*.")
            else
              MSG=$(printf '%s\n' \
                "⚠️ The branch is pushed and the work is safe, but opening the PR failed:" "" \
                "$(head -c 600 /tmp/pr-err.txt)" "" \
                "**Open it manually:** $COMPARE")
            fi
            echo "::warning::PR not opened — $COMPARE"
            printf '%s\n' "### ⚠️ PR not opened" "" "$MSG" >> "$GITHUB_STEP_SUMMARY"
            : # dispatch path has no originating issue — the warning and summary carry it
            exit 0
          fi
          echo "$PR_URL"
          gh pr merge --auto --squash "$PR_URL" || echo "auto-merge not armed (non-fatal)"
