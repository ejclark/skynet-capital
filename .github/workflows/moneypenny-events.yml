name: Moneypenny Events

# ONE ROUTER FOR EVERY ISSUE-DRIVEN AUTOMATION (docs/HANDOFFS.md), replacing four workflows that
# had grown to 482 lines carrying 202 lines of untestable bash. The logic lives in
# scripts/moneypenny.mjs (formerly postmaster.mjs), which is pure where it decides and specced against fixture payloads —
# this file is a trigger shim and nothing else.
#
# ═══ WHY THE BUILD RUNS HERE INSTEAD OF VIA AN @claude ISSUE ═══
#
# The old chain was: push → handoff-detect opens an issue mentioning @claude → claude.yml sees the
# `issues.opened` event → builds. It never once worked, and on 2026-08-17 the canary showed why:
# **events triggered by GITHUB_TOKEN do not start other workflow runs** (GitHub's infinite-loop
# guard). handoff-detect creates its issue with GITHUB_TOKEN, so the `issues.opened` event was
# never emitted, so claude.yml had zero runs against it — while the hourly polling Routine quietly
# carried the load and produced nothing. The chain was structurally severed at the join, and the
# poller masked it.
#
# So the hop is gone: this workflow scans AND builds in the same run. The issue is still opened —
# as the audit trail and the human-visible queue — but it is a RECEIPT, never a trigger. Nothing
# in the critical path depends on one workflow's write emitting an event another workflow hears.
#
# `claude.yml` stays for what it is actually good at: a human typing @claude on an issue or PR.
# That path works, because a human's token is not GITHUB_TOKEN.
#
# ═══ WHY EVERY PR-OPENING STEP USES THE GITHUB APP'S TOKEN ═══
#
# The severance has a second mouth, found the same night one hop past the first fix: the build's
# final act is opening a PR, also with GITHUB_TOKEN, so `pull_request.opened` is never emitted and
# `pipeline.yml`'s required `verify` check never runs. PR #371 opened with a clean diff and
# **zero check runs** — not a red check, no checks, and `mergeable_state: blocked` forever.
#
# GitHub documents exactly two identities whose events are NOT suppressed: a GitHub App
# installation token, and a PAT. Every PR-facing step here mints a GITHUB APP INSTALLATION TOKEN,
# per job, via actions/create-github-app-token — the App acts as its own bot identity, never
# expires, and is the strongest tier available (Eric, 2026-08-17: "a probot app seems like a
# superior later abstraction as the postmaster role").
#
# NO FALLBACK TIER (Eric, 2026-08-28 — the App is assumed reliable, no backup plan needed). Earlier
# revisions degraded through a fine-grained PAT (`HANDOFF_PR_TOKEN`) and then bare GITHUB_TOKEN if
# the App wasn't configured; that ladder is gone. If `vars.APP_CLIENT_ID` / `secrets.APP_PRIVATE_KEY`
# are ever unset or the App loses repo access, these jobs fail loudly on an auth error instead of
# quietly opening a PR nobody can merge — a loud failure here is cheaper than a silent one (see
# docs/LESSONS.md, 2026-08-17: a PR with zero checks and `mergeable_state: blocked` sat unnoticed).
#
# The App token is minted in EACH job that needs it, never passed between them: the action revokes
# its token when the job ends (`skip-token-revoke` defaults false), and an installation token
# expires after an hour regardless. Per-job minting is the supported shape, not duplication.
#
# What must NOT be done instead: having the build mint its own check run named `verify` via the
# Checks API. It would work, and it would be a gate certifying itself — strictly worse than a gate
# that visibly did not run. See docs/LESSONS.md 2026-08-17.

on:
  # THE PLAN LANE'S READY-FLIP TRIGGER (#823, Eric: "There's a lot of issues that seem to
  # arbitrarily wait on my guidance... move forward"). A `feedback`-labeled issue gets built the
  # instant the label lands (the `issues: labeled` trigger below); a `plan`-labeled issue had no
  # equivalent — "say ready and the lane picks it up" is written into dozens of plan issues, but
  # nothing read a ready comment and acted on it, so a human had to notice by hand. Measured on
  # #823 itself: #467/#468/#469 sat 7.3 days fully scoped and defaulted, waiting only on the flip.
  # `types: [created]` only — an EDITED comment is not a fresh ready-flip, and re-editing an old
  # comment must never retroactively fire a build.
  issue_comment:
    types: [created]
  # EVERY MERGE TO MAIN IS THE TICK — no cron, by directive (Eric, 2026-08-19: "cron jobs are
  # generally terrible … focus on event driven architecture"; codified in docs/ROUTINES.md).
  # This works because every check here is LEVEL-BASED: the sweep, the stall audit, and
  # event-scan --due each read current state from scratch, so any push reconciles everything —
  # including anything a dropped webhook missed. No path filter, deliberately: repo activity
  # itself is the clock, and a filtered path would just narrow the reconciliation for no saving
  # (a no-op route job costs seconds on a public repo's free runners). Research PRs merging are
  # themselves pushes, so working the event backlog is a self-perpetuating chain: research lands →
  # push → scan → next due event. The prior generation of this job ran on claude.ai Routine crons
  # that fired ~130 times into sessions with no repo checkout and produced nothing
  # (docs/ROUTINES.md, Retired) — a poller that quietly produces nothing is the failure mode this
  # repo already banked once (2026-08-17). Known residual, accepted on the record: a completely
  # quiet repo checks nothing until the next merge or a manual `scan` dispatch — see
  # docs/ROUTINES.md for the escape hatches.
  push:
    branches: [main]
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      command:
        description: What to do
        required: true
        type: choice
        options: [scan, audit, release-claim]
        default: scan
      slug:
        description: "Claim slug (release-claim) — e.g. feedback-<issue number>"
        required: false
        type: string

permissions:
  contents: write       # create claim refs (the lease) and let build lanes push branches
  issues: write         # open issues, comment receipts
  pull-requests: write  # open the PRs
  id-token: write       # claude-code-action
  actions: write        # gh workflow run — the push→workflow_dispatch re-fire for event research

concurrency:
  # Keyed by event so a feedback claim and a push sweep never queue behind each other. ALSO keyed
  # by label name (2026-08-29, #716's stall): filing an issue can add several labels in a burst —
  # each `labeled` add is its OWN `issues` event, and without the label in the key they all shared
  # one group. GitHub's queue then collapses a same-second burst down to the first-running run plus
  # only the LAST queued one, silently dropping everything in between — and on #716, six labeled
  # events (a duplicate label-apply doubled the usual three) collapsed exactly onto `enhancement`
  # and `member-<id>`, both times dropping the `feedback` event, which is the ONLY trigger for
  # `build-feedback`. The issue was never claimed; nothing failed loudly. Splitting the group per
  # label means sibling labels on the same issue can no longer cancel each other's run — a second
  # `feedback` event on the SAME issue (e.g. a genuine re-label retry) still collides with the
  # first, which is the intended dedupe, since `claimFeedback`'s lease already makes that safe.
  # Empty for push/workflow_dispatch (no `label` on those payloads), so their grouping is unchanged.
  group: moneypenny-events-${{ github.event_name }}-${{ github.event.issue.number || github.ref }}-${{ github.event.label.name || '' }}
  cancel-in-progress: false

jobs:
  route:
    name: route
    runs-on: ubuntu-latest
    outputs:
      due_events: ${{ steps.screen.outputs.due }}
      feedback_issue: ${{ steps.feedback.outputs.number }}
      feedback_model: ${{ steps.feedback.outputs.model }}
      plan_issue: ${{ steps.plan.outputs.number }}
      plan_model: ${{ steps.plan.outputs.model }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # scans read history (quiet-day math, ledger checks)

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc   # .nvmrc is the single source of truth — never pin here

      # The App identity, when one is configured. Guarded on the client-id VARIABLE (not a secret —
      # a client id is not sensitive, and `if:` cannot read secrets) so an unconfigured repo skips
      # this step instead of failing the run on a missing private key.
      - id: app-token
        uses: ./.github/actions/app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # The sweep: one receipt issue per never-assessed event, deduped by open-issue title, plus
      # the release-claim dispatch. One entry point, one set of specs (tests/scripts/moneypenny).
      # (The handoff lanes — ready-sweep, inbox zip import, flip button — were retired 2026-08-21:
      # design handoffs are `[handoff]` issues now, docs/HANDOFFS.md.)
      # The App token, no fallback tier — see the header.
      - name: Run Moneypenny
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node scripts/moneypenny.mjs

      # The loop's eyes, event-driven: the stall audit rides every push instead of a clock — it
      # ran only on manual dispatch before, a watchdog nobody winds. Comment-and-warn only
      # (audit() is ceiling-capped by design), and it dedupes nothing itself: quietDays only
      # crosses the threshold once per day, so repeat comments stay rare.
      #
      # Also the merge-conflict sweep (#909): a PR going `CONFLICTING` against `main` produces no
      # CI signal at all — nothing runs, nothing goes red, so nothing else here would ever notice.
      # `main`'s own tick, which this step already rides, is exactly the moment a conflict like
      # that becomes checkable. Detection + a one-ping comment only, same as the rest of this
      # step — repair (merging main in and resolving it) is a later slice, not this one.
      - name: Audit for stalls & conflicts
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/moneypenny.mjs --audit

      # Which events owe research right now. Filtered against open research/<id> PR heads
      # (dueForResearch, specced) so back-to-back pushes can't double-research an event whose PR
      # is still open — concurrency serializes runs, and each new run sees the last one's PRs.
      - name: List due events
        id: events
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.command == 'scan')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DUE=$(node scripts/event-scan.mjs --due)
          HEADS=$(gh pr list --state open --limit 100 --json headRefName | jq -c '[.[].headRefName]')
          FILTERED=$(node -e '
            import("./scripts/moneypenny.mjs").then((m) => {
              const due = JSON.parse(process.argv[1]);
              const heads = JSON.parse(process.argv[2]);
              const out = m.dueForResearch(due, heads).map((e) => ({ id: e.id, reason: e.reason }));
              console.log(JSON.stringify(out));
            });
          ' "$DUE" "$HEADS")
          echo "due=$FILTERED" >> "$GITHUB_OUTPUT"
          echo "::notice::due for research: $FILTERED"

      # THE DETERMINISTIC MATERIAL-CHANGE PROBE (issue #724) — the free no-op path, same doctrine
      # as digest-scan.mjs. `event-scan.mjs --due` only answers WHEN a pulse is owed; this answers
      # WHETHER anything the probe can measure actually moved. Only `interval-elapsed` items are
      # ever screened (event-material-scan.mjs itself passes never-assessed/event-passed-unscored
      # straight through) — a screen writes its own ledger row and this step commits it directly to
      # `main`, so it never spends a session. That commit MUST land before the re-dispatch step
      # below, or the Claude session's own `event-scan.mjs --due` (it re-runs that check itself, per
      # .github/prompts/event-research.md) would still see the screened event as due and research it
      # anyway — hence a direct push here rather than a second PR-and-merge round trip. Requires the
      # App token (same "no fallback tier" doctrine as the rest of this file, see the header) — with
      # no App configured, or if the push is ever rejected (branch protection, a race with a human
      # push), this fails soft to the ORIGINAL due list: every event in question still gets a real
      # session, never silently dropped (broken != quiet, the loud-failure doctrine).
      - name: Screen interval-elapsed pulses deterministically (issue #724)
        id: screen
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.command == 'scan')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::no App token configured — skipping the deterministic screen this run; every due pulse dispatches a session (safe default)."
            echo "due=${{ steps.events.outputs.due }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RESULT=$(echo '${{ steps.events.outputs.due }}' | node scripts/event-material-scan.mjs --screen-due)
          SCREENED_COUNT=$(echo "$RESULT" | jq '.screened | length')
          STILL_DUE=$(echo "$RESULT" | jq -c '.stillDue')
          echo "::notice::deterministic screen: $SCREENED_COUNT screened (no session), $(echo "$STILL_DUE" | jq 'length') still due for research"
          if [ "$SCREENED_COUNT" -eq 0 ]; then
            echo "due=$STILL_DUE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/events/*.md
          git commit -m "docs(research): deterministic screen — $SCREENED_COUNT pulse(s), no session needed"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if git push origin HEAD:main; then
            echo "due=$STILL_DUE" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::screen commit failed to push (branch protection, or a race with another push) — falling back to a full session for every due event this pulse."
            echo "due=${{ steps.events.outputs.due }}" >> "$GITHUB_OUTPUT"
          fi

      # `claude-code-action@v1` rejects `push` as an event type outright (docs/LESSONS.md
      # 2026-08-20: "Unsupported event type: push" — the event-research lane's first live firings
      # all failed this way). It DOES support `workflow_dispatch`, so on a push with due events we
      # re-fire ourselves as a dispatch instead of letting `build-events` invoke the action directly
      # under `push`. `build-events` below only runs on that re-dispatched pass (see its `if:`).
      - name: Re-dispatch for event research (claude-code-action can't see `push`)
        if: github.event_name == 'push' && steps.screen.outputs.due != '' && steps.screen.outputs.due != '[]'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run moneypenny-events.yml --ref "$GITHUB_REF_NAME" -f command=scan

      # THE FEEDBACK LANE'S GATE (2026-08-19, Eric: "I expected the issues to get received and
      # assigned to a claude session"). A `feedback` label was applied — applying labels requires
      # triage/write permission, so on this public repo the label IS the authorization; issue
      # CREATION alone never starts AI work (a stranger can open an issue, not label one). The
      # lease (claim/feedback-<n>) makes a re-label a safe retry, not a second build.
      # Claim the lease AND pick the model tier in one specced call (`claimFeedback`). Both used to
      # be inline bash — the tier heuristic was a `$(… && echo …)` that exits 1 under `set -e`
      # whenever the `&&` short-circuits, so every feedback issue over 600 chars with no code fence
      # killed its own build before Claude was invoked (run 32545818804, #475). Logic that decides
      # anything belongs in the specced script; this file is a trigger shim, per the header.
      - name: Claim a feedback issue, if one was labelled
        id: feedback
        if: github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'feedback'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/moneypenny.mjs --claim-feedback

      # THE PLAN LANE'S GATE (#823) — mirrors the feedback gate immediately above, one authorization
      # boundary down. A plan issue's `ready` is a COMMENT, not a label, so the boundary is WHO
      # commented rather than who applied a label: `author_association` must be OWNER, MEMBER, or
      # COLLABORATOR — the exact same check `claude.yml`'s `gate` job already uses for "is this
      # person a recognized repo member" (a stranger cannot say ready on someone else's public repo
      # and start a build). The `plan` label check and the ready-PATTERN match both happen inside
      # `claimPlan` (scripts/moneypenny-plan-claim.mjs) — pure, fixture-specced — so this `if:` only
      # carries the cheap, github-context-only filters, same division as the feedback gate.
      - name: Claim a plan issue, if the owner said ready
        id: plan
        if: >-
          github.event_name == 'issue_comment' && github.event.action == 'created' &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/moneypenny.mjs --claim-plan

  # ═══ THE EVENT-RESEARCH LANE (2026-08-19) ═══
  # Replaces the daily claude.ai event-scan Routine, which fired for three days into fresh sessions
  # with no repo checkout and produced nothing while interactive sessions carried its load
  # (docs/ROUTINES.md, Retired). Same protocol — but repo-resident, versioned, event-driven (every
  # merge is the tick; no cron), and incapable of the no-checkout failure. The prompt is
  # docs/ROUTINES.md's old verbatim Routine prompt adapted for a workflow session;
  # docs/process/EVENT-RESEARCH.md stays the protocol owner.
  build-events:
    name: research due events
    needs: route
    # workflow_dispatch only — claude-code-action@v1 rejects `push` as an event type (see the
    # re-dispatch step in `route`, which is what fires this job's real run for a push's findings).
    if: >-
      github.event_name == 'workflow_dispatch' &&
      needs.route.outputs.due_events != '' && needs.route.outputs.due_events != '[]'
    # ONE MATRIX LEG PER DUE EVENT (2026-08-29, #799/#800/#801's stall). This job used to be a
    # single session looping over the whole due list — a batch of 4 events (a normal Tuesday, let
    # alone "six critical prints + FOMC/CPI in one week", #724's own worst-case) shares one
    # `--max-turns` budget sized for the WHOLE batch, so turn count was measuring "how much
    # legitimate work is there this week," never "is this session stuck." The observed failure: a
    # 4-event run hit turn 101 mid-wrap-up (`error_max_turns`, 25 min, $11.50) after already
    # opening PRs for 3 of them — orphaned with no way to tell whether their checks would ever
    # fire. Matrixing gives every event its OWN session and its OWN turn budget: a stuck/runaway
    # session on ONE event still gets caught fast (the guard is now TIGHTER — 60 turns for one
    # event's work is a smaller window than 100 for a whole batch used to be), and a busy week is
    # more parallel jobs, never a shared budget several events race against. `fail-fast: false` so
    # one event's session dying never cancels its siblings' already-in-flight work.
    strategy:
      fail-fast: false
      matrix:
        event: ${{ fromJSON(needs.route.outputs.due_events) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Minted per-job (per matrix leg, here), same as `build` — the action revokes its token at
      # job end.
      - id: app-token
        uses: ./.github/actions/app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - id: gate
        uses: ./.github/actions/oauth-gate
        with:
          token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          blocked-message: >-
            CLAUDE_CODE_OAUTH_TOKEN missing — event ${{ matrix.event.id }} is due but nothing will
            research it.

      - if: steps.gate.outputs.armed == 'true'
        id: build
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The App token, no fallback tier — see the header. So each PR this session opens
          # actually triggers `verify`.
          github_token: ${{ steps.app-token.outputs.token }}
          # This job only ever runs on the `route` job's own re-dispatch (`gh workflow run`, see
          # above) — no human ever triggers it directly — so the run's actor is `github-actions`,
          # a bot. claude-code-action refuses to act for a non-human actor by default (2026-08-20:
          # "Workflow initiated by non-human actor: github-actions (type: Bot)"); this is the one
          # and only bot that can ever legitimately land here, so it's named explicitly rather than
          # `*` (allow every bot).
          allowed_bots: "github-actions"
          # WebSearch/WebFetch on top of the build lane's list: a pulse check without the adjacency
          # sweep (peer prints, CPI/FOMC surprises, VIX regime) is the protocol minus its point.
          # --model pins the lane deliberately instead of riding the action default — same
          # route-by-who-pays rule as build-feedback (flat-rate lane, research-to-brief floor is
          # opus per docs/COMPUTE.md). --max-turns is a runaway backstop only, scoped to ONE
          # event's work (a `never-assessed` initial write-up — TEMPLATE + stance + kill switches
          # + first ledger row — is the heaviest single-event case, typically 20-30 turns). The 60
          # set here 2026-08-28 turned out too tight within a day — two runs finished normal work
          # at turns 63 and 65-67, over cap (issue #904); 90 gives real headroom over the worst
          # observed overrun. docs/process/TOKEN-EFFICIENCY.md, 2026-08-28; issue #904, 2026-08-29.
          claude_args: |
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch" --model claude-opus-5 --max-turns 90
          # Same shim: the protocol lives in .github/prompts/event-research.md. This run is
          # pre-assigned exactly one event (this matrix leg's) — the prompt tells it not to touch
          # any other due event even though `event-scan.mjs --due` will still list every one of
          # them (sibling matrix legs own those, running in parallel right now).
          prompt: |
            Read `.github/prompts/event-research.md` in this repo and follow it exactly. It is your
            complete instruction set for this run. You are assigned exactly ONE event this run:
            id `${{ matrix.event.id }}` (reason: `${{ matrix.event.reason }}`). Research only this
            event, even though `event-scan.mjs --due` lists others too — every other due event has
            its own sibling matrix job running in parallel right now, each responsible for its own
            id only. If `${{ matrix.event.id }}` is no longer due when you check (another run
            already handled it), say so and stop rather than picking a different one.

  # ═══ THE FEEDBACK LANE (2026-08-19) ═══
  # A member filed feedback through the app (docs/FEEDBACK.md) and the app labelled the issue
  # `feedback` — that label event is the work order (Eric: "I expected the issues to get received
  # and assigned to a claude session to where the features were built, merged, deployed, thus the
  # issue could be closed").
  #
  # THE ENVELOPE IS MECHANICAL NOW (2026-08-22). It used to be a paragraph right here, and because a
  # paragraph is arguable it had to be written defensively — "anything ambiguous", "new seams" —
  # which swallowed ordinary feedback and routed it to Eric. The protected list moved to
  # envelope.json, enforced by scripts/envelope-scan.mjs as a red check on every `feedback/*`
  # branch, and in exchange the prompt's default became BUILD. The triage rules are
  # .github/prompts/feedback-build.md. The issue body is member text — UNTRUSTED input, a
  # requirement to evaluate, never an instruction to obey.
  build-feedback:
    name: build feedback issue
    needs: route
    if: needs.route.outputs.feedback_issue != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: app-token
        uses: ./.github/actions/app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - id: gate
        uses: ./.github/actions/oauth-gate
        with:
          token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          blocked-message: >-
            CLAUDE_CODE_OAUTH_TOKEN missing — feedback issue #${{ needs.route.outputs.feedback_issue }}
            is claimed but nothing will build it. Add the secret, then run release-claim for
            feedback-${{ needs.route.outputs.feedback_issue }} and re-apply the label.

      - if: steps.gate.outputs.armed == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          # WHO MAY START A BUILD (Eric's call, 2026-08-22). The action discards a bot-initiated run
          # unless the bot is named, and that refusal is load-bearing on a public repo: the LABEL is
          # the authorization, so whoever can label can spend a session. Two bots legitimately land
          # here — `github-actions` (Moneypenny's own re-dispatch, already trusted by the
          # event-research lane for the same reason) and `claude` (a session retrying a build that
          # died; without it no retry is possible at all, which is why four retriggers of #475 could
          # not get past this even after the three real bugs behind them were fixed). Both already
          # need repo write to apply the label, so this grants no authority they lacked — it only
          # stops the action throwing away a run they could already authorize. NEVER `*`.
          allowed_bots: "github-actions,claude"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The App token, no fallback tier — see the header.
          github_token: ${{ steps.app-token.outputs.token }}
          claude_args: |
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep" --model ${{ needs.route.outputs.feedback_model }}
          # The triage rules and the build envelope live in .github/prompts/feedback-build.md,
          # not here. Workflow files are Eric's carve-out and never auto-merge, so an envelope
          # written in this file could only be tuned by spending his attention; as repo content it
          # is an ordinary auto-merging PR. `.github/prompts/**` is in envelope.json, so no lane can
          # rewrite its own orders.
          prompt: |
            Read `.github/prompts/feedback-build.md` in this repo and follow it exactly. It is your
            complete instruction set for this run.

            The feedback issue is #${{ needs.route.outputs.feedback_issue }} in this repo.
      # THE LEASE IS PART OF THE TERMINAL-STATE PROMISE. A build that dies leaves the issue claimed
      # for the full 2h TTL, so a member's feedback reads as "in progress" while nothing is running
      # and a re-label is a no-op — the exact shape that hid three separate failures on 2026-08-22.
      # Freeing it here makes a retry immediate; the claim itself still prevents double-builds.
      - if: failure() && needs.route.outputs.feedback_issue != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/moneypenny.mjs --release feedback-${{ needs.route.outputs.feedback_issue }}

  # ═══ THE PLAN LANE (#823) ═══
  # Eric (or another authorized identity — see the `route` job's `plan` step) commented a ready-flip
  # on a `plan`-labeled issue. Structurally identical to `build-feedback` above — same claim lease,
  # same App-token PR path, same never-silent exit — because the design intent (#823's own
  # constraint) is to reuse that lane's shape rather than invent a second mechanism.
  build-plan:
    name: build plan issue
    needs: route
    if: needs.route.outputs.plan_issue != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: app-token
        uses: ./.github/actions/app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - id: gate
        uses: ./.github/actions/oauth-gate
        with:
          token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          blocked-message: >-
            CLAUDE_CODE_OAUTH_TOKEN missing — plan issue #${{ needs.route.outputs.plan_issue }} is
            claimed but nothing will build it. Add the secret, then run release-claim for
            plan-${{ needs.route.outputs.plan_issue }} and comment ready again.

      - if: steps.gate.outputs.armed == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The App token, no fallback tier — see the header. So this build's own PR triggers `verify`.
          github_token: ${{ steps.app-token.outputs.token }}
          claude_args: |
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep" --model ${{ needs.route.outputs.plan_model }}
          # The triage rules and the build envelope live in .github/prompts/plan-build.md, not
          # here — same reasoning as feedback-build.md (see its file for the full rationale):
          # workflow files never auto-merge, so an envelope living here could only be tuned by
          # spending Eric's attention, while `.github/prompts/**` is ordinary auto-merging content
          # protected from self-modification by envelope.json.
          prompt: |
            Read `.github/prompts/plan-build.md` in this repo and follow it exactly. It is your
            complete instruction set for this run.

            The plan issue is #${{ needs.route.outputs.plan_issue }} in this repo.
      # Same terminal-state promise as the feedback lane: a build that dies must not leave the issue
      # claimed for the full 2h TTL while looking "in progress" with nothing running.
      - if: failure() && needs.route.outputs.plan_issue != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/moneypenny.mjs --release plan-${{ needs.route.outputs.plan_issue }}

