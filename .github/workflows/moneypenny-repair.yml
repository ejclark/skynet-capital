name: Moneypenny Repair

# THE LANE THAT WATCHES THE LANES. A run fails on `main`, this files one capsule issue with the
# evidence and dispatches a session to fix it — instead of the failure sitting red until someone
# happens to look at the Actions tab. Formerly "CI Medic" — renamed #912 as part of folding both
# postmaster's and this lane's responsibilities into one identity (docs/MONEYPENNY.md), the way
# #909 already folded their dispatch mechanisms together.
#
# WHY (Eric, 2026-08-22): run 32545818804 died in a bash step of the feedback lane AFTER taking the
# issue's claim lease, so issue #475 looked claimed and nothing built it. Silent, and it would have
# stayed silent. "We should have a job kicked off that automatically resolves these types of
# failures."
#
# This file is a trigger shim, exactly like postmaster.yml (the event router — #912's own plan
# renames that one too, in a later slice): every decision lives in scripts/moneypenny-repair.mjs,
# which is pure where it decides and specced against fixture payloads
# (tests/scripts/moneypenny-repair.spec.ts). Logic in `run:` blocks is what caused the failure this
# lane exists to catch — see docs/LESSONS.md.
#
# THE LOOP GUARDS (a self-healing lane that can trigger itself is a bill, not a net). All four live
# in the router, where they are specced against fixture payloads:
#   1. This workflow's own failures are ignored.
#   2. Only default-branch runs are acted on — a red PR belongs to that PR's author and its
#      watching session, and repair PRs opened here would otherwise feed the lane its own output.
#   3. One open issue per failure signature; a recurrence comments instead of filing again.
#   4. A signature carrying `needs-eric` silences this lane for that signature entirely.
#
# The triage job's `if:` also screens out healthy runs before a runner starts; the router's copies
# of the guards are the specced ones, and the job condition is an optimisation, not the contract.
#
# A SECOND ENTRY POINT (#909, folding postmaster's conflict detection into this same dispatcher —
# Eric, 2026-08-29: "keep chipping away at postmaster and ci-medic responsibilities to fold them
# into Moneypenny's [mandate] for her to manage"). `workflow_dispatch` below lets postmaster's audit
# step (`scripts/moneypenny.mjs`'s `flag-conflict` intent) hand this lane a PR number instead of a
# failed run — the `repair` job below already IS a generic "dispatch a Claude session against a
# named target" job, so a conflicted PR reuses it rather than earning a second workflow file. Its
# own memory (postmaster's `conflict-flagged` label) is the dedupe; this lane adds none of its own
# for that path, deliberately — one label owner, not two.

on:
  # THE LIST IS REQUIRED IN PRACTICE. Dropping it (to catch unparseable files, whose runs are named
  # by path rather than by workflow name) made GitHub reject THIS file — a run named
  # `.github/workflows/ci-medic.yml` (this file's name before #912) with zero jobs, the same shape
  # the lane exists to catch, on the lane itself. SchemaStore marks `workflows` optional; GitHub's
  # own validator evidently does not. Empirical beats documented: the list stays.
  #
  # The path forms are here for the unparseable case: when GitHub cannot parse a file it names the
  # run after the path, so the path is what a name filter has to match. NEVER add this workflow's
  # own name or path — that is loop guard 1.
  workflow_run:
    workflows:
      ["Postmaster", "Pipeline", "Autonomy ops", ".github/workflows/postmaster.yml",
       ".github/workflows/pipeline.yml", ".github/workflows/autonomy-ops.yml"]
    types: [completed]
  # #909's conflict-repair entry point. `pr_number` alone, never a fixture-style event payload — a
  # `workflow_dispatch` call carries no `workflow_run` object at all, so the `triage` job below is
  # skipped outright (its `if:` only matches a `workflow_run` completion) and `repair` runs on this
  # trigger directly.
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to attempt a conflict repair on
        required: true
        type: string

permissions:
  contents: read        # the repair session mints its own token for pushes
  issues: write         # file the capsule, comment recurrences
  actions: read         # read the failed run's jobs and logs
  pull-requests: write  # the repair session opens the PR

concurrency:
  # Per signature-ish: one repair-lane run per watched workflow at a time, never cancelling a triage
  # mid-file (a half-filed issue is worse than a queued one). A `workflow_dispatch` conflict-repair
  # carries no `workflow_run` object at all, so it keys on the PR number instead — two different
  # PRs' repairs must never serialize behind each other, but the same PR dispatched twice should.
  group: moneypenny-repair-${{ github.event.workflow_run.name || format('pr-{0}', github.event.inputs.pr_number) }}
  cancel-in-progress: false

jobs:
  triage:
    name: triage the failure
    # Back to the single-line condition that provably parsed. Two things changed in the amendment
    # GitHub rejected — the missing `workflows:` list and this condition becoming a folded multi-line
    # expression — and with no readable error from a zero-job run, the honest move is a minimal delta
    # from the known-good file rather than a second guess. The router enforces all four guards from
    # the payload, and those are the specced ones; this line only keeps healthy runs off a runner.
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    outputs:
      issue: ${{ steps.router.outputs.issue }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc   # .nvmrc is the single source of truth — never pin here

      # One line, on purpose. Evidence gathering, dedupe and the decision are all in the router.
      - id: router
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/moneypenny-repair.mjs

  repair:
    name: repair the failure or a flagged conflict
    needs: triage
    # `always()` because `triage` is legitimately SKIPPED (not failed) on a `workflow_dispatch`
    # conflict trigger — its own `if:` only matches a `workflow_run` completion, and a skipped
    # dependency still lets a downstream job run under `always()`. The two conditions are mutually
    # exclusive by construction (one event carries `workflow_run`, the other `inputs.pr_number`),
    # so this never double-fires on one event.
    if: always() && (needs.triage.outputs.issue != '' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The App identity, so the repair PR emits `pull_request.opened` and `verify` actually runs.
      # Same reasoning as postmaster.yml's header — a PR with zero checks is worse than a red one.
      # No fallback tier (Eric, 2026-08-28 — the App is assumed reliable): unconfigured or
      # access-lost fails this job loudly instead of opening a repair PR under a weaker identity.
      - id: app-token
        if: vars.APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - id: gate
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TARGET: ${{ needs.triage.outputs.issue != '' && format('issue #{0}', needs.triage.outputs.issue) || format('PR #{0}', github.event.inputs.pr_number) }}
        run: |
          if [ -n "$TOKEN" ]; then echo "armed=true" >> "$GITHUB_OUTPUT"
          else
            echo "armed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN missing — $TARGET carries the evidence but nothing will repair it."
          fi

      - if: steps.gate.outputs.armed == 'true' && needs.triage.outputs.issue != ''
        uses: anthropics/claude-code-action@v1
        with:
          # Without this the lane can DETECT but never REPAIR. A run of this lane is woken by
          # `workflow_run` and inherits the failed run's actor, so a failure that a bot triggered
          # produced a capsule issue and then died here — verified on the lane's first live outing
          # (2026-08-22, issue #487). Same two names as the feedback lane, same reasoning; the
          # triage job's guards already restrict this to failures on the default branch.
          allowed_bots: "github-actions,claude"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The App token, no fallback tier — see above.
          github_token: ${{ steps.app-token.outputs.token }}
          claude_args: |
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep" --model claude-opus-5
          # The repair envelope lives in .github/prompts/moneypenny-ci-repair.md, not here. Those hard
          # limits are exactly the kind of rule that must stay tunable without a carve-out merge —
          # and `.github/prompts/**` is protected by envelope.json, so this lane cannot loosen its
          # own leash.
          prompt: |
            Read `.github/prompts/moneypenny-ci-repair.md` in this repo and follow it exactly. It is your
            complete instruction set for this run.

            This lane's issue is #${{ needs.triage.outputs.issue }} in this repo.

      # #909's second entry point — a `workflow_dispatch` conflict-repair carries no repair issue at
      # all, just a PR number. Same job, same gate, a different instruction set: mutually exclusive
      # with the step above by construction (one needs `needs.triage.outputs.issue`, this needs
      # `workflow_dispatch`), so exactly one of the two ever runs per invocation of this job.
      - if: steps.gate.outputs.armed == 'true' && github.event_name == 'workflow_dispatch'
        uses: anthropics/claude-code-action@v1
        with:
          allowed_bots: "github-actions,claude"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          claude_args: |
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep" --model claude-opus-5
          # The repair envelope lives in .github/prompts/moneypenny-conflict-repair.md, same reasoning as
          # moneypenny-ci-repair.md above — never in this workflow file.
          prompt: |
            Read `.github/prompts/moneypenny-conflict-repair.md` in this repo and follow it exactly. It is
            your complete instruction set for this run.

            The PR to repair is #${{ github.event.inputs.pr_number }} in this repo.
