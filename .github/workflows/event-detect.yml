name: Event detect

# Layer 1 of the market-event pickup (docs/process/EVENT-RESEARCH.md): when a new event lands on
# main — a market-events.ts entry or an earnings-calendar.ts print — open an `event-research`-
# labelled issue for it within seconds. The daily event-scan Routine (docs/ROUTINES.md) is the
# redundant catch: its `never-assessed` rule makes the same event due on the next cycle, so this
# workflow is a latency optimization, never load-bearing.
#
# Rationing: `paths:` keeps this off every unrelated push, and the scan is dependency-free, so
# there is no `npm ci` here (GHA minutes are the metered constraint — see pipeline.yml).
#
# Idempotent by construction: the issue title is exactly "[event-research] <id>", so a re-push
# while the event is still unassessed finds the open issue and does nothing.

on:
  push:
    branches: [ main ]
    paths:
      - 'src/domain/market-events.ts'
      - 'src/domain/earnings-calendar.ts'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: event-detect
  cancel-in-progress: false

jobs:
  detect:
    name: detect unassessed events
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc   # .nvmrc is the single source of truth — never pin here

      - name: Scan for never-assessed events
        id: scan
        run: |
          NEW=$(node scripts/event-scan.mjs --due | jq '[.[] | select(.reason == "never-assessed")]')
          COUNT=$(echo "$NEW" | jq 'length')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "$NEW" > /tmp/new-events.json
          echo "$COUNT never-assessed event(s)."
          node scripts/event-scan.mjs

      - name: Open an issue per new event
        if: steps.scan.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          api() { curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }

          # The label may not exist yet on a fresh repo; creating it twice is a harmless 422.
          api -X POST "https://api.github.com/repos/$REPO/labels" \
            -d '{"name":"event-research","color":"0e8a16","description":"A calendar event awaiting initial research"}' \
            >/dev/null || true

          OPEN=$(api "https://api.github.com/repos/$REPO/issues?state=open&labels=event-research&per_page=100")

          jq -c '.[]' /tmp/new-events.json | while read -r E; do
            ID=$(echo "$E" | jq -r .id)
            TITLE=$(echo "$E" | jq -r .title)
            DATE=$(echo "$E" | jq -r .date)
            IMPACT=$(echo "$E" | jq -r .impact)
            STATUS=$(echo "$E" | jq -r .status)
            LEDGER=$(echo "$E" | jq -r .ledger)
            ISSUE_TITLE="[event-research] $ID"

            if [ "$(echo "$OPEN" | jq -r --arg t "$ISSUE_TITLE" '[.[] | select(.title == $t)] | length')" != "0" ]; then
              echo "· $ID — already queued, nothing to do."
              continue
            fi

            BODY=$(printf '%s\n' \
              "@claude — a calendar event is awaiting initial research: **$TITLE** ($DATE, $STATUS, impact: $IMPACT)" \
              "" \
              "Run the \`never-assessed\` mode of [\`docs/process/EVENT-RESEARCH.md\`](../blob/main/docs/process/EVENT-RESEARCH.md):" \
              "produce \`$LEDGER\` from its TEMPLATE (initial research + stance + kill switches + first" \
              "ledger row), and ship it via \`/ship\`. The daily event-scan Routine will take the pulse" \
              "checks from there." \
              "" \
              "---" \
              "_Opened automatically by the event watcher (\`.github/workflows/event-detect.yml\`)._")

            api -X POST "https://api.github.com/repos/$REPO/issues" \
              -d "$(jq -n --arg t "$ISSUE_TITLE" --arg b "$BODY" '{title:$t, body:$b, labels:["event-research"]}')" \
              | jq -r '"▶ queued " + .html_url'
          done
