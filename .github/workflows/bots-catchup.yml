# Bots deploy catch-up (#5006).
#
# pipeline.yml's deploy-bots preflight debounces: at most one bots redeploy per 15m cooldown, and a
# skipped deploy is promised to "the next preflight past it". But a preflight only runs on a push —
# with no further merge, a bot fix sat merged-but-not-live (#5005 on 2026-10-09: merged 18:23Z,
# skipped "3m ago, under the 15m cooldown", live only after a manual force_bots_deploy at 18:38Z).
#
# This is that "next preflight", on a clock. Every 15 minutes it asks the SAME decision script
# (scripts/bots-deploy-preflight.mjs — baseline diff, debounce, bot-relevance; never forced) whether
# the bots app is behind main, and if so pulls pipeline.yml's own recovery lever. It never deploys
# anything itself, so every deploy still goes through the one audited path.
#
# Guards, each against a real double-restart or stale-image failure:
#  - any pipeline run in progress → skip (its own deploy-bots job is about to answer);
#  - main's HEAD without a successful dashboard deploy → skip (the recovery lever reuses the
#    dashboard's image, which would not yet contain HEAD).
#
# THE CLOCK'S ORDER (2026-11-01, #6470's study). Every step after the first runs on `!cancelled()`,
# because a failed start — the start script exits 3 when its 3-starts-in-6h budget is spent — must
# not skip the catch-up deploy, and must not skip the one step that can tell the owner. The fitness
# contracts run LAST with no `continue-on-error`: they used to run second behind the start step, so
# all six went dark exactly when a corrector had failed, and `continue-on-error` hid a crash as a
# green step. Now a failed contract is a red run, which is what the repair lane and his
# notifications read. The App token is minted beside the Fly token here, so it is scoped to the two
# writes this job makes (issues, actions) and nothing else the App can do; a failed mint falls back
# to GITHUB_TOKEN rather than skipping anything (the mint carries `continue-on-error`).
name: Bots deploy catch-up

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write # dispatch pipeline.yml's force_bots_deploy — GITHUB_TOKEN may trigger workflow_dispatch
  issues: write # bots-start-stopped.sh keeps a stopped machine's evidence on an issue

concurrency:
  group: bots-catchup
  cancel-in-progress: false

jobs:
  catch-up:
    runs-on: ubuntu-latest
    # Sized from the 40 most recent successful scheduled runs (read 2026-11-01): 13s min, 21s
    # median, 26s p90, 29s max. Ten minutes is about twenty times the slowest run and under the
    # 15-minute tick, so a hung Fly or GitHub read ends before the next tick queues behind it.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0 # the preflight diffs from the machine's stamped GIT_SHA

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc # the one source of truth for CI's Node; the scripts below run on it

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
        with:
          version: 0.4.99

      # Scoped to the two writes this job makes. `continue-on-error` so a failed mint can never
      # skip the start step: an empty token below falls back to GITHUB_TOKEN.
      - id: app-token
        continue-on-error: true
        uses: ./.github/actions/app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-issues: write
          permission-actions: write

      - name: Start the machine if it is stopped
        # A crash between merges has no deploy coming to recover it (#5955). This keeps the exit
        # record and a named cause on an issue and stops after 3 starts in 6 hours.
        env:
          GH_TOKEN: ${{ github.token }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_BOTS || secrets.FLY_ORG_TOKEN }}
        run: bash scripts/bots-start-stopped.sh skynet-capital-bots --report

      - name: Is a bot-relevant commit stranded?
        id: check
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_BOTS || secrets.FLY_ORG_TOKEN }}
          FORCE: "false"
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$(gh run list --workflow pipeline.yml --status in_progress --json databaseId --jq length)" != "0" ] \
            || [ "$(gh run list --workflow pipeline.yml --status queued --json databaseId --jq length)" != "0" ]; then
            echo "skip: a pipeline run is in flight — its own deploy-bots job decides"; echo "dispatch=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          RUN_ID=$(gh run list --workflow pipeline.yml --event push --commit "$HEAD_SHA" --json databaseId --jq '.[0].databaseId // empty')
          DEPLOY=$( [ -n "$RUN_ID" ] && gh run view "$RUN_ID" --json jobs --jq '.jobs[] | select(.name == "release · deploy") | .conclusion' || true)
          if [ "$DEPLOY" != "success" ]; then
            echo "skip: main $HEAD_SHA has no successful dashboard deploy (got '${DEPLOY:-none}') — the lever would reuse an older image"
            echo "dispatch=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          MACHINE_JSON=$(flyctl machine list -a skynet-capital-bots --json 2>/dev/null || true)
          DEPLOYED_SHA=$(jq -r '[.[] | select((.config.standbys // []) | length == 0)][0].config.env.GIT_SHA // empty' <<<"$MACHINE_JSON" 2>/dev/null || true)
          DEPLOYED_AT=$(jq -r '[.[] | select((.config.standbys // []) | length == 0)][0].updated_at // empty' <<<"$MACHINE_JSON" 2>/dev/null || true)
          VERDICT=$(DEPLOYED_SHA="$DEPLOYED_SHA" DEPLOYED_AT="$DEPLOYED_AT" HEAD_SHA="$HEAD_SHA" node scripts/bots-deploy-preflight.mjs)
          DECISION=$(head -n1 <<<"$VERDICT")
          echo "$DECISION: $(tail -n1 <<<"$VERDICT")"
          echo "dispatch=$([ "$DECISION" = deploy ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Pull the recovery lever
        if: ${{ !cancelled() && steps.check.outputs.dispatch == 'true' }}
        # The App token when the mint succeeded: a GITHUB_TOKEN dispatch hides the run it starts
        # from the repair lane (docs/LESSONS.md, 2026-09-08). GITHUB_TOKEN may still dispatch.
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          gh workflow run pipeline.yml --ref main -f force_bots_deploy=true
          echo "::notice::bots app behind main — dispatched pipeline.yml force_bots_deploy (#5006)"

      - name: Where the week stands (report only)
        # The weekly pace reading against the dial, printed on every tick so it is on record
        # between touch points (#6470). It writes nothing anywhere, and a failed read must not
        # cost the contracts below their run.
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/moneypenny/quota.mjs --tick

      - name: Check what must stay true
        # Fitness contracts, probed from outside the apps, so a dead process cannot silence them. A
        # failure keeps one issue assigned to the owner, which needs no mail credential; a stall
        # alert detected correctly for two weeks and reached nobody without one (#6470). Last, on
        # `!cancelled()`, with no `continue-on-error`: see the header. The App token's issue
        # writes wake the lanes (a GITHUB_TOKEN label write starts no run); GITHUB_TOKEN is the
        # fallback when the mint failed, so a report still lands.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_BOTS || secrets.FLY_ORG_TOKEN }}
        run: node scripts/fitness.mjs --report
