name: Postmaster

# ONE ROUTER FOR EVERY ISSUE-DRIVEN AUTOMATION (docs/HANDOFFS.md), replacing four workflows that
# had grown to 482 lines carrying 202 lines of untestable bash. The logic lives in
# scripts/postmaster.mjs, which is pure where it decides and specced against fixture payloads —
# this file is a trigger shim and nothing else.
#
# ═══ WHY THE BUILD RUNS HERE INSTEAD OF VIA AN @claude ISSUE ═══
#
# The old chain was: push → handoff-detect opens an issue mentioning @claude → claude.yml sees the
# `issues.opened` event → builds. It never once worked, and on 2026-08-17 the canary showed why:
# **events triggered by GITHUB_TOKEN do not start other workflow runs** (GitHub's infinite-loop
# guard). handoff-detect creates its issue with GITHUB_TOKEN, so the `issues.opened` event was
# never emitted, so claude.yml had zero runs against it — while the hourly polling Routine quietly
# carried the load and produced nothing. The chain was structurally severed at the join, and the
# poller masked it.
#
# So the hop is gone: this workflow scans AND builds in the same run. The issue is still opened —
# as the audit trail and the human-visible queue — but it is a RECEIPT, never a trigger. Nothing
# in the critical path depends on one workflow's write emitting an event another workflow hears.
#
# `claude.yml` stays for what it is actually good at: a human typing @claude on an issue or PR.
# That path works, because a human's token is not GITHUB_TOKEN.
#
# ═══ WHY EVERY PR-OPENING STEP MINTS A GITHUB APP TOKEN ═══
#
# The severance has a second mouth, found the same night one hop past the first fix: the build's
# final act is opening a PR, also with GITHUB_TOKEN, so `pull_request.opened` is never emitted and
# `pipeline.yml`'s required `verify` check never runs. PR #371 opened with a clean diff and
# **zero check runs** — not a red check, no checks, and `mergeable_state: blocked` forever.
#
# GitHub documents exactly two identities whose events are NOT suppressed: a GitHub App
# installation token, and a PAT. So the PR-facing steps prefer, in order:
#
#   1. a GITHUB APP INSTALLATION TOKEN, minted per-job by actions/create-github-app-token.
#      (Eric, 2026-08-17: "a probot app seems like a superior later abstraction as the postmaster
#      role.") He is right about the half that carries the value — the App IDENTITY is the fix, and
#      unlike a PAT it never expires and acts as its own bot rather than as him. The hosted Probot
#      SERVICE is a separate, later question (docs/IDEAS.md); nothing here needs a server.
#   2. `secrets.HANDOFF_PR_TOKEN`, the repo-scoped fine-grained PAT from #386 — kept as a tier so a
#      repo that already minted one is never silently downgraded by this change.
#   3. GITHUB_TOKEN — the honest degrade. The PR still opens (work is never stranded) and the run
#      warns, naming the close/reopen workaround, because a PR nobody can merge is worse than a
#      loud notice.
#
# The App token is minted in EACH job that needs it, never passed between them: the action revokes
# its token when the job ends (`skip-token-revoke` defaults false), and an installation token
# expires after an hour regardless. Per-job minting is the supported shape, not duplication.
#
# What must NOT be done instead: having the build mint its own check run named `verify` via the
# Checks API. It would work, and it would be a gate certifying itself — strictly worse than a gate
# that visibly did not run. See docs/LESSONS.md 2026-08-17.

on:
  push:
    branches: [main]
    paths:
      - 'docs/handoffs/**'
      - 'src/domain/market-events.ts'
      - 'src/domain/earnings-calendar.ts'
  # The daily clock (2026-08-19). This replaced two claude.ai-side Routines — the hourly handoff
  # poller and the daily event-scan — after a week proved they fired into sessions with no repo
  # checkout and produced literally nothing (docs/ROUTINES.md, Retired). A repo-resident schedule
  # cannot have that failure: checkout is a step. The scheduled run is (1) the event-research
  # clock, (2) a sweep net under the push trigger for anything a push event missed, and (3) the
  # stall audit's clock. 11:07 UTC ≈ 06:07/07:07 ET across DST, matching the old event-scan hour;
  # :07 because GitHub sheds and delays on-the-hour crons hardest.
  schedule:
    - cron: '7 11 * * *'
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      command:
        description: What to do
        required: true
        type: choice
        options: [flip-handoff, scan, audit, release-claim]
        default: scan
      slug:
        description: "Handoff slug (flip-handoff / release-claim) — the folder name under docs/handoffs/"
        required: false
        type: string

permissions:
  contents: write       # push handoff/flip branches, create claim refs
  issues: write         # open issues, comment receipts
  pull-requests: write  # open the PRs
  id-token: write       # claude-code-action

concurrency:
  # Keyed by event so an issue import and a push sweep never queue behind each other.
  group: postmaster-${{ github.event_name }}-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: false

jobs:
  route:
    name: route
    runs-on: ubuntu-latest
    outputs:
      build_slug: ${{ steps.claim.outputs.slug }}
      due_events: ${{ steps.events.outputs.due }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the importer branches off origin/main

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc   # .nvmrc is the single source of truth — never pin here

      # The App identity, when one is configured. Guarded on the client-id VARIABLE (not a secret —
      # a client id is not sensitive, and `if:` cannot read secrets) so an unconfigured repo skips
      # this step instead of failing the run on a missing private key.
      - id: app-token
        if: vars.APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # Everything the four old workflows did: sweep for ready handoffs and due events and open
      # their issues, import a zip dropped on a labelled issue, flip a handoff on dispatch, audit
      # for stalls. One entry point, one set of specs.
      # This step opens PRs (flips, zip imports), so it takes the strongest identity available.
      # The `||` chain is the honest degrade, not an oversight — see the header.
      - name: Run the postmaster
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.HANDOFF_PR_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/postmaster.mjs

      # The loop's eyes get a clock: the stall audit ran only on manual dispatch before, which is
      # a watchdog nobody winds. Comment-and-warn only (audit() is ceiling-capped by design).
      - name: Audit for stalls
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/postmaster.mjs --audit

      # Which events owe research today. Only the scheduled run (or a manual `scan`) researches —
      # a push touching the calendar opens receipt issues via the sweep above, but the deep-dive
      # work waits for the daily lane so one calendar edit can't trigger an hours-long AI session.
      - name: List due events
        id: events
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.command == 'scan')
        run: |
          set -euo pipefail
          DUE=$(node scripts/event-scan.mjs --due | jq -c '[.[] | {id, reason}]')
          echo "due=$DUE" >> "$GITHUB_OUTPUT"
          echo "::notice::due events: $DUE"

      # Claim BEFORE building, not at first commit. `POST /git/refs` is atomic — 422 if the ref
      # exists — so this is a real compare-and-set, and the claim is visible in `git ls-remote`
      # within seconds instead of whenever a session gets around to committing.
      - name: Claim a ready handoff, if any
        id: claim
        if: github.event_name != 'workflow_dispatch' || inputs.command == 'scan'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SLUG=$(node scripts/handoff-scan.mjs --ready | jq -r '.[0].slug // empty')
          if [ -z "$SLUG" ]; then
            echo "· nothing ready to build."
            exit 0
          fi
          RESULT=$(node -e '
            import("./scripts/postmaster.mjs").then((m) => {
              const r = m.claimHandoff(process.argv[1], process.argv[2], Date.now());
              console.log(JSON.stringify(r));
            });
          ' "$SLUG" "$GITHUB_SHA")
          echo "$RESULT"
          if [ "$(echo "$RESULT" | jq -r .claimed)" = "true" ]; then
            echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
            echo "::notice::claimed $SLUG — building in this run"
          else
            echo "::notice::not building $SLUG — $(echo "$RESULT" | jq -r .reason)"
          fi

  build:
    name: build the handoff
    needs: route
    if: needs.route.outputs.build_slug != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Inert without the secret, exactly like claude.yml's gate — the notice says so rather than
      # failing, so an unarmed repo degrades to "issue opened, nobody built it" instead of red CI.
      # Minted again here rather than passed from `route`: the action revokes its token at job end,
      # so a token carried across jobs would already be dead.
      - id: app-token
        if: vars.APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - id: gate
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PR_TOKEN: ${{ steps.app-token.outputs.token || secrets.HANDOFF_PR_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "armed=true" >> "$GITHUB_OUTPUT"
          else
            echo "armed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN missing — ${{ needs.route.outputs.build_slug }} is claimed but nothing will build it. Add the secret, then run the postmaster's release-claim command to retry."
          fi
          # Not fatal, but the reader must be told: with neither the App nor the PAT, the PR this
          # build opens will carry ZERO check runs and can never satisfy branch protection.
          if [ -z "$PR_TOKEN" ]; then
            echo "::warning::No App token or HANDOFF_PR_TOKEN — the PR this build opens will have no check runs (GITHUB_TOKEN cannot emit pull_request events). Close and reopen it from any other account to arm CI. Permanent fix: install the postmaster GitHub App (docs/HANDOFFS.md)."
          fi

      - if: steps.gate.outputs.armed == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The strongest identity available, so the PR this session opens actually triggers `verify`.
          github_token: ${{ steps.app-token.outputs.token || secrets.HANDOFF_PR_TOKEN || secrets.GITHUB_TOKEN }}
          # WITHOUT THIS THE BUILD SILENTLY DOES NOTHING (2026-08-17, docs/LESSONS.md). The first
          # real run went green having accomplished nothing: the session started, ran 21 turns,
          # spent $0.88 — and logged `permission_denials_count: 6`. Only GitHub's own tools are
          # granted by default, so every git/npm/gh call was refused. The action still exits
          # `success` because the SESSION completed without error, which is how a green workflow
          # and an untouched repo coexisted. A build needs to edit files, run the gates, and push.
          claude_args: |
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep"
          prompt: |
            Build the design handoff `${{ needs.route.outputs.build_slug }}` in this repo.

            Its contract is `docs/handoffs/${{ needs.route.outputs.build_slug }}/README.md` — read it
            first. Its EARS acceptance criteria define "done"; nothing else does.

            Execution discipline (docs/HANDOFFS.md):
            1. Branch off the latest origin/main. Flip the handoff's status `ready` → `executing` in
               your FIRST commit — a lease ref `claim/${{ needs.route.outputs.build_slug }}` already
               marks this run as the claimant, and that flip is its human-readable mirror.
            2. Reconcile any bundle tokens against docs/BRAND.md BEFORE writing code. Where they
               disagree the brand wins, and the divergence gets a line in the decision log.
            3. Reuse src/ui before adding anything new. Keep the change as small as the contract allows.
            4. Verify by exit status, never tailed output: `npm run typecheck`, `npm run lint`,
               `npm test`.
            5. Open the PR. Do NOT auto-merge it — Eric reviews. Then flip the status to `review` and
               close the handoff's `[handoff] <slug>` issue with the PR link.

            Boundaries, non-negotiable: never flip a handoff to `ready` yourself (that is Eric's
            authorization); never widen the autonomy envelope; never touch credentials, spend, or
            anything outward-facing. Bank anything you cannot answer from the contract in its Q&A
            queue and continue on unblocked threads rather than guessing.

  # ═══ THE EVENT-RESEARCH LANE (2026-08-19) ═══
  # Replaces the daily claude.ai event-scan Routine, which fired for three days into fresh sessions
  # with no repo checkout and produced nothing while interactive sessions carried its load
  # (docs/ROUTINES.md, Retired). Same protocol, same clock — but repo-resident, versioned, and
  # incapable of the no-checkout failure. The prompt is docs/ROUTINES.md's old verbatim Routine
  # prompt adapted for a workflow session; docs/process/EVENT-RESEARCH.md stays the protocol owner.
  build-events:
    name: research due events
    needs: route
    if: needs.route.outputs.due_events != '' && needs.route.outputs.due_events != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Minted per-job, same as `build` — the action revokes its token at job end.
      - id: app-token
        if: vars.APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - id: gate
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "armed=true" >> "$GITHUB_OUTPUT"
          else
            echo "armed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN missing — events are due but nothing will research them: ${{ needs.route.outputs.due_events }}"
          fi

      - if: steps.gate.outputs.armed == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The strongest identity available, so each PR this session opens actually triggers `verify`.
          github_token: ${{ steps.app-token.outputs.token || secrets.HANDOFF_PR_TOKEN || secrets.GITHUB_TOKEN }}
          # WebSearch/WebFetch on top of the build lane's list: a pulse check without the adjacency
          # sweep (peer prints, CPI/FOMC surprises, VIX regime) is the protocol minus its point.
          claude_args: |
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"
          prompt: |
            You are in the skynet-capital repo. Run `node scripts/event-scan.mjs --due`. If it
            prints `[]`, stop — nothing is due. Otherwise, for each due event, follow the matching
            mode in `docs/process/EVENT-RESEARCH.md`:

            - `never-assessed` → initial research producing `docs/research/events/<id>.md` from its
              TEMPLATE (initial research + stance + kill switches + first ledger row).
            - `interval-elapsed` → pulse check appending ONE ledger row, including the mandatory
              adjacency sweep (peer prints, CPI/FOMC surprises, VIX regime moves, geopolitics
              touching the event's symbols) — any dated adjacent event you discover is PROPOSED as
              an `estimate` entry in `src/domain/market-events.ts` in the same PR, never `confirmed`.
            - `event-passed-unscored` → closing outcome assessment, scoring registered forward tests
              from re-run instrument data (bust the instrument cache first: `rm -rf
              node_modules/.cache/earnings-cycle node_modules/.cache/intraday-edges`), never from
              memory.

            Ship ONE PR per event: branch off origin/main, verify by exit status and never by tailed
            output (`npm run typecheck`, `npm run lint`, `npm test`), push, open the PR with
            `gh pr create`, then arm auto-merge with `gh pr merge --auto --squash` — research-ledger
            docs auto-merge per the governor's merge policy. Conventional-Commit subjects,
            lowercase-led.

            HARD LIMITS: no trades; no edits to playbooks, guards, or earnings-calendar entries; no
            flipping any `estimate` to `confirmed` without a primary source (IR:/BLS:/FED:); never
            touch credentials, spend, or anything outward-facing; escalation ceiling is a PR. Every
            trading-adjacent statement you write must carry the event's confirmed/estimate label
            honestly — estimates widen caution, never trigger action.
