name: Pipeline

# One workflow, one runner, one install — the whole path from verify to live.
# Previously this was three separate workflows (CI + Release + Deploy), each
# spinning up its own runner and re-running `npm ci`, with Deploy chained behind
# CI via `workflow_run` (which GitHub schedules with extra latency). Collapsing
# them removes two runner spin-ups, a duplicate install, and the handoff delay —
# the "minutes" between merge and live.
#
#   • pull_request → verify only (typecheck · lint · test)
#   • push to main → verify, then release + deploy + smoke + rollback in the SAME
#     runner, so nothing ships unless the same tree just went green.
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  # Cancel superseded PR runs; never cancel a main run mid-deploy.
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  pipeline:
    name: verify · release · deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # semantic-release needs full history
          persist-credentials: true

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ---- verify (every event) ----
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (Biome)
        run: npm run lint
      - name: Test (Rstest)
        run: npm test

      # ---- release + deploy (main pushes only, same runner) ----
      - name: Semantic Release
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Set up flyctl
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: superfly/flyctl-actions/setup-flyctl@master

      # Remember the image serving RIGHT NOW so a bad release can be rolled back to it.
      # Best-effort: a failure here still lets us deploy — the smoke check below is the guard.
      - name: Capture previous image
        id: prev
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        run: |
          IMG=$(flyctl image show -a skynet-capital --json \
            | jq -r 'if type=="array" then .[0] else . end
                     | if .Digest and .Digest != "" then "\(.Registry)/\(.Repository)@\(.Digest)"
                       else "\(.Registry)/\(.Repository):\(.Tag)" end' 2>/dev/null || true)
          echo "image=$IMG" >> "$GITHUB_OUTPUT"
          echo "previous image: ${IMG:-<none — rollback unavailable this run>}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy to Fly
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # The harness that makes zero-human deploys safe: probe the live public surface.
      # A release that doesn't serve is not a release.
      - name: Smoke test the release
        id: smoke
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: bash scripts/smoke.sh https://skynet-capital.fly.dev

      - name: Roll back to previous image
        if: ${{ failure() && steps.smoke.conclusion == 'failure' && steps.prev.outputs.image != '' }}
        run: |
          echo "smoke failed — rolling back to ${{ steps.prev.outputs.image }}"
          flyctl deploy -a skynet-capital --image "${{ steps.prev.outputs.image }}"
          bash scripts/smoke.sh https://skynet-capital.fly.dev
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
