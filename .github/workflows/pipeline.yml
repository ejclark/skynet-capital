name: Pipeline

# One workflow, split into two mutually-exclusive jobs so no runner-minute is ever spent twice:
#   • verify (pull_request only) — commitlint + typecheck + lint + test, on ONE runner.
#   • deploy  (push to main only) — release + deploy + smoke + rollback, with NO re-verify:
#     branch protection requires `verify` to pass before merge, so the merged commit is already
#     validated. Re-running the suite on main was pure duplication — this removes it.
#
# Rationing measures (GHA minutes are the metered constraint):
#   - commitlint folded in here → the separate commitlint.yml workflow is deleted (~240 min/mo saved).
#   - docs-only PRs still run `verify` but SKIP the heavy steps (typecheck/lint/test) — the job
#     spins up, reports `verify` green in seconds, and lets auto-merge fire. (We can't paths-ignore
#     `**.md` here: a required check that never runs leaves docs PRs stuck "waiting for status".)
#   - draft PRs don't run — but see the `types:` note below; "doesn't run yet" must not decay into
#     "never runs".
#   - main pushes skip verify (deploy only) → no duplicate test run per merge.
on:
  pull_request:
    branches: [ main ]
    # `ready_for_review` is NOT in the default type list (opened/synchronize/reopened), and leaving
    # it out silently voided the whole gate for any PR that started as a draft: the draft's run
    # skipped `verify`, promoting it to ready fired no run at all, and that stale `skipped` check
    # stayed the latest word — which branch protection counts as a PASS. PR #322 merged that way,
    # having never run a single test in CI. It matters far more than it looks: Claude opens every
    # PR as a draft by default, so this was every Claude-authored PR, not an edge case.
    types: [ opened, synchronize, reopened, ready_for_review ]
  push:
    branches: [ main ]
    # NEVER add `paths:` filters here: a non-matching push would produce NO run at all, so
    # semantic-release would silently stop cutting releases for those commits and deploy-lag would
    # cry wolf with no visible cause (its own header documents exactly this failure from its first
    # cut). Selectivity lives INSIDE the run — the deploy-bots preflight — never on the trigger.
  workflow_dispatch:
    inputs:
      force_bots_deploy:
        description: >-
          Recovery lever for the bots app: redeploy skynet-capital-bots from the dashboard's
          current image regardless of what the path classifier says. Use when a bots deploy was
          wrongly skipped or failed and the fix is "just deploy it".
        type: boolean
        default: false

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  verify:
    name: verify
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    # Least privilege: this job only checks out a PR's own head and runs commitlint/typecheck/
    # lint/test against it — no step calls the GitHub API with the default token. A job-level
    # `permissions:` block REPLACES the workflow-level one for this job (never merges with it), so
    # this is the actual cap regardless of what other jobs below need.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0            # commitlint needs the PR commit range

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc   # .nvmrc is the single source of truth — never pin here
          cache: npm
          # This job is the only one that also installs app/ (a separate package, its own
          # lockfile — not an npm workspace). Without listing BOTH lockfiles here, the cache key
          # only ever hashes the root one: a PR that doesn't touch root's package-lock.json gets a
          # cache HIT on that key, and actions/cache only re-saves on a MISS — so every package
          # `npm ci --prefix app` fetches during a hit run is silently discarded at job end. The
          # symptom (docs/LESSONS.md, 2026-09-04): "Install app dependencies" paying a near-full
          # network fetch for its ~130 packages on almost every run, run after run, never warming.
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Detect non-docs changes
        id: changes
        run: |
          if git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} \
               | grep -qvE '\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "docs-only PR — skipping typecheck/lint/test; verify still reports green."
          fi

      - name: Commit lint
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      # app/ is a separate package (its own package.json, own node_modules — not an npm
      # workspace), so it needs its own install. Root's `npm ci` above doesn't touch it.
      - name: Install app dependencies
        if: steps.changes.outputs.code == 'true'
        run: npm ci --prefix app

      # Typecheck/lint/test are independent checks over the same unchanged tree — nothing
      # downstream of `npm ci` depends on another's output. Backgrounding them on the shared runner
      # instead of running as sequential steps overlaps the ~10s typecheck+lint pair with the
      # test suite (the long pole, ~30s locally) instead of paying for both back to back: same
      # billed job, shorter wall clock, no extra runner-minutes. Logs go to files so a failure's
      # full output still surfaces (backgrounded output would otherwise interleave illegibly), and
      # each PID's exit code is checked individually so one failure never masks another's.
      - name: Typecheck + lint + test (parallel)
        if: steps.changes.outputs.code == 'true'
        run: |
          npm run typecheck > typecheck.log 2>&1 & tc=$!
          npm run lint       > lint.log      2>&1 & ln=$!
          npm test           > test.log      2>&1 & ts=$!
          npm run typecheck --prefix app > app-typecheck.log 2>&1 & atc=$!
          npm test           --prefix app > app-test.log      2>&1 & ats=$!

          status=0
          for pair in "$tc:typecheck" "$ln:lint" "$ts:test" "$atc:app-typecheck" "$ats:app-test"; do
            pid="${pair%%:*}"; name="${pair##*:}"
            if wait "$pid"; then
              echo "✓ $name passed"
            else
              echo "✗ $name failed — output:"
              cat "$name.log"
              status=1
            fi
          done
          exit $status

  arm-auto-merge:
    name: arm auto-merge
    # Mirrors .github/prompts/interactive.md's own merge policy (hold only for a protected path, an
    # explicit ask, or a taste fork worth Eric's eyes) — but runs it for every PR instead of relying
    # on whichever session opened it to remember the call. Interactive/remote sessions authenticate
    # their GitHub tools as Eric personally, so arming auto-merge by hand there spends HIS personal
    # GraphQL quota, not the App's — this job arms with the App's own token and rate-limit bucket
    # instead (already provisioned: vars.APP_CLIENT_ID, same as claude.yml/moneypenny-events.yml/moneypenny-repair.yml).
    # A session (or Eric) that wants a specific PR held despite being green applies the `hold-merge`
    # label — that's the one signal this job can't derive from the diff itself.
    needs: verify
    if: >-
      ${{ github.event_name == 'pull_request' && needs.verify.result == 'success' &&
          github.event.pull_request.draft == false &&
          contains(fromJSON('["opened","reopened","ready_for_review"]'), github.event.action) &&
          !contains(github.event.pull_request.labels.*.name, 'hold-merge') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: app-token
        uses: ./.github/actions/app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc   # .nvmrc is the single source of truth — never pin here
          cache: npm

      - name: Install dependencies
        # envelope-scan.mjs's diffAware path imports envelope-widening.mjs, which imports the
        # `typescript` devDependency — without this, --check crashes with ERR_MODULE_NOT_FOUND
        # before printing anything, which then fed an empty pipe into the JSON parse below and
        # failed this job outright instead of correctly finding this very PR's own diff protected.
        run: npm ci

      - name: Is the diff protected?
        id: envelope
        run: |
          FILES=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          echo "changed files:"; echo "$FILES"
          BLOCKING=$(node scripts/envelope-scan.mjs --check $FILES --base "${{ github.event.pull_request.base.sha }}" \
            | jq '[.[] | select(.blocking)] | length > 0')
          echo "blocking=$BLOCKING" >> "$GITHUB_OUTPUT"

      - name: Arm auto-merge (or merge directly if already green)
        if: ${{ steps.envelope.outputs.blocking == 'false' && steps.app-token.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          PR="${{ github.event.pull_request.number }}"
          if ! OUT=$(gh pr merge --auto --squash "$PR" 2>&1); then
            if echo "$OUT" | grep -qi "clean status"; then
              echo "$OUT"
              echo "already green — merging directly instead of arming"
              gh pr merge --squash "$PR"
            else
              echo "$OUT" >&2
              exit 1
            fi
          fi

  deploy:
    name: release · deploy
    # Merged commits are already verified (branch protection required `verify`), so this path
    # never re-runs the suite — it only ships. This job deploys the DASHBOARD app on EVERY push
    # on purpose: its durable state is volume-backed (restarts are harmless) and docs/research
    # merges need it (the /research shelf is read from the image at request time). The stateful
    # half — the bots app — deploys selectively in `deploy-bots` below.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      # The image this push built and verified, for deploy-bots to reuse — one build per push,
      # the two apps provably on the same bits whenever both roll.
      image: ${{ steps.released.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc   # .nvmrc is the single source of truth — never pin here
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Capture previous image
        # A shim: scripts/fly-image-ref.mjs owns the decision and is specced. It prints NOTHING when
        # there is no real image, so the rollback guards below can trust `!= ''` — the inline jq this
        # replaced answered `null/null:null` on a null record and defeated exactly that guard (#671).
        id: prev
        continue-on-error: true
        run: |
          IMG=$(flyctl image show -a skynet-capital --json 2>/dev/null \
            | node scripts/fly-image-ref.mjs || true)
          echo "image=$IMG" >> "$GITHUB_OUTPUT"
          echo "previous image: ${IMG:-<none — rollback unavailable this run>}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy to Fly
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Smoke test the release
        id: smoke
        run: bash scripts/smoke.sh https://skynet-capital.fly.dev

      - name: Capture released image (for deploy-bots)
        id: released
        run: |
          IMG=$(flyctl image show -a skynet-capital --json 2>/dev/null \
            | node scripts/fly-image-ref.mjs || true)
          echo "image=$IMG" >> "$GITHUB_OUTPUT"
          echo "released image: ${IMG:-<none>}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Roll back to previous image
        if: ${{ failure() && steps.smoke.conclusion == 'failure' && steps.prev.outputs.image != '' }}
        run: |
          echo "smoke failed — rolling back to ${{ steps.prev.outputs.image }}"
          flyctl deploy -a skynet-capital --image "${{ steps.prev.outputs.image }}"
          bash scripts/smoke.sh https://skynet-capital.fly.dev
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-bots:
    name: release · deploy bots
    # The STATEFUL half of the deploy split: skynet-capital-bots redeploys ONLY when the push
    # touched the bots runtime (scripts/bot-relevant.mjs — the single source of truth, biased to
    # over-deploy), so docs/frontend merges stop wiping the trader's in-memory signal windows
    # (2026-08-26: 41 merges restarted it ~every 15 minutes and Sauron never traded once).
    #
    # The diff baseline is GROUND TRUTH, not workflow archaeology: each deploy stamps the machine
    # with --env GIT_SHA, and the preflight diffs from what the machine actually runs. A
    # concurrency-superseded or failed run can therefore never strand a bot-relevant commit —
    # the next run's diff still spans it. Every ambiguity fails OPEN to deploying.
    #
    # `needs: deploy` gives listener-first ordering for free (the dashboard — the bridge listener —
    # is already on the new code before bots roll) and reuses its verified image: one build per
    # push, no second remote build, both apps provably on the same bits.
    needs: deploy
    if: >-
      ${{ always() && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.deploy.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.force_bots_deploy)
      ) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0            # the preflight diffs from the machine's stamped GIT_SHA

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Preflight — should the bots app deploy?
        # The decision tree (token/cutover/force/baseline/classify) lives in
        # scripts/bots-deploy-preflight.mjs, spec-tested (tests/scripts/bots-deploy-preflight.spec.ts)
        # — this step now does only the two genuinely environmental lookups (the flyctl API call,
        # GITHUB_SHA) and translates the script's two-line verdict into $GITHUB_OUTPUT.
        id: preflight
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_BOTS || secrets.FLY_ORG_TOKEN }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_bots_deploy && 'true' || 'false' }}
        run: |
          DEPLOYED_SHA=$(flyctl machine list -a skynet-capital-bots --json 2>/dev/null \
            | jq -r '[.[] | select((.config.standbys // []) | length == 0)][0].config.env.GIT_SHA // empty' || true)
          VERDICT=$(DEPLOYED_SHA="$DEPLOYED_SHA" HEAD_SHA="$GITHUB_SHA" node scripts/bots-deploy-preflight.mjs)
          echo "$VERDICT"
          DECISION=$(head -n1 <<<"$VERDICT")
          REASON=$(tail -n1 <<<"$VERDICT")
          echo "deploy=$([ "$DECISION" = deploy ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "$DECISION: $REASON"

      - name: Resolve image
        if: ${{ steps.preflight.outputs.deploy == 'true' }}
        id: image
        run: |
          IMG="${{ needs.deploy.outputs.image }}"
          if [ -z "$IMG" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Dispatch recovery path: no fresh build this run — reuse whatever the dashboard runs.
            IMG=$(flyctl image show -a skynet-capital --json 2>/dev/null \
              | node scripts/fly-image-ref.mjs || true)
          fi
          # On the push path an empty image is a hard FAIL, never a silent rebuild: a second build
          # could diverge from what smoke verified, and moneypenny-repair.yml files the capsule on a red run.
          [ -n "$IMG" ] || { echo "::error::no dashboard image to reuse — refusing to rebuild"; exit 1; }
          echo "image=$IMG" >> "$GITHUB_OUTPUT"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Capture previous bots image
        # Same shim as the dashboard's `prev` step. On the bots app's FIRST deploy there is no
        # previous image at all, and silence is the correct rendering of that — see #671, where the
        # old jq named a nonexistent one and the rollback died trying to deploy it.
        if: ${{ steps.preflight.outputs.deploy == 'true' }}
        id: prev-bots
        continue-on-error: true
        run: |
          IMG=$(flyctl image show -a skynet-capital-bots --json 2>/dev/null \
            | node scripts/fly-image-ref.mjs || true)
          echo "image=$IMG" >> "$GITHUB_OUTPUT"
          echo "previous bots image: ${IMG:-<none — rollback unavailable this run>}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_BOTS || secrets.FLY_ORG_TOKEN }}

      - name: Deploy bots
        # deploy-lag.mjs reads THIS step's conclusion (by name) to find the last real bots deploy —
        # a preflight skip leaves it `skipped`, so a no-op run can never poison the lag baseline.
        #
        # GIT_SHA is stamped via a TEMP COPY of fly.bots.toml's [env] block, never `flyctl deploy
        # --env` — verified live on 2026-08-27 that the flag does not reliably persist into
        # `flyctl machine list --json`'s `config.env` (three deploys in a row stamped the flag,
        # every one read back null; matches a known community-reported flyctl gap). A [env] line
        # in the config file is what fly.bots.toml's own SKYNET_AUTONOMOUS_MODE already proves
        # persists correctly — same mechanism, so GIT_SHA rides it instead of the unreliable flag.
        if: ${{ steps.preflight.outputs.deploy == 'true' }}
        run: |
          # Insert as the FIRST line under [env] — TOML is order-sensitive, so appending at
          # end-of-file would land the key under [[vm]] instead. sed inserts right after the
          # `[env]` header line, ahead of the block's own keys/comments.
          sed "/^\[env\]/a\\
            GIT_SHA = \"${{ github.sha }}\"" fly.bots.toml > /tmp/fly.bots.deploy.toml
          grep -A2 '^\[env\]' /tmp/fly.bots.deploy.toml
          flyctl deploy --config /tmp/fly.bots.deploy.toml --image "${{ steps.image.outputs.image }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_BOTS || secrets.FLY_ORG_TOKEN }}

      - name: Smoke test the bots release
        if: ${{ steps.preflight.outputs.deploy == 'true' }}
        id: smoke-bots
        run: bash scripts/smoke-bots.sh skynet-capital-bots "${{ github.sha }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_BOTS || secrets.FLY_ORG_TOKEN }}

      - name: Roll back bots to previous image
        # A rollback drops the GIT_SHA stamp (fly.toml env only), so the NEXT push's preflight
        # finds no baseline and fails open to deploying — the safe direction after a bad release.
        if: ${{ failure() && steps.smoke-bots.conclusion == 'failure' && steps.prev-bots.outputs.image != '' }}
        run: |
          echo "bots smoke failed — rolling back to ${{ steps.prev-bots.outputs.image }}"
          flyctl deploy --config fly.bots.toml --image "${{ steps.prev-bots.outputs.image }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_BOTS || secrets.FLY_ORG_TOKEN }}
