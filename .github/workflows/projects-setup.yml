name: Projects v2 setup

# One-time (idempotent, safe to re-run), #3818 slice B. Creates the "Skynet Capital —
# Orchestration" GitHub Project (kanban/backlog/roadmap views on one board) and its four fields,
# via `gh project`.
#
# Uses `secrets.PROJECTS_PAT`, Eric's own classic personal access token with `project` scope —
# NOT the Moneypenny App's installation token. GitHub Apps' Projects permission is org-scoped
# only (confirmed in GitHub's own REST permissions docs), and this repo's owner (`ejclark`) is a
# personal User account, which has no App-token path to Projects v2 at all, admin or not. A
# personal token is the only mechanism GitHub offers for a user-owned project.
#
# `workflow_dispatch` only, never a push/issue trigger: this provisions infrastructure, not a
# per-event action, and it should run exactly when someone means it to.
#
# GraphQL — which `gh project` compiles to — is blocked from interactive Claude Code sessions, so
# this workflow's real IO could not be exercised while authoring it (see
# scripts/moneypenny/projects-setup.mjs's header). This run's own job log is the verification.
#
# HISTORY (kept short; the full trail is #3818's state block, not here): the App-token attempt
# failed outright (org-scoped permission); the first `PROJECTS_PAT` attempt failed with
# "Resource not accessible by personal access token" even after the `project` scope was added —
# a diagnostic step (removed here, once it did its job) found the secret held a stale token
# value; re-saving it with the token's current value fixed it. Project #2 is live:
# https://github.com/users/ejclark/projects/2
#
# `backfill` (#3818 consolidation pass, 2026-09-27) runs after `setup` on every dispatch — adds
# every open, non-ci-failure issue to the board with Status set and Horizon applied from
# scripts/moneypenny/projects-horizons.json. Safe to re-run; re-run it whenever that file's
# triage is updated.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  setup:
    name: create project + fields
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc   # .nvmrc is the single source of truth for CI, not mise.toml — see moneypenny-events.yml

      - name: create project + fields
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_PAT }}
        run: node scripts/moneypenny/projects-setup.mjs

  backfill:
    name: backfill open issues onto the board
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: backfill Status + Horizon onto every open issue
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_PAT }}
        run: node scripts/moneypenny/projects-backfill.mjs
