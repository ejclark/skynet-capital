name: Autonomy ops

# Manually-triggered ops for the always-on bots process — no terminal, no local flyctl. Operates
# on the app the `target_app` input names (post-deploy-split default: skynet-capital-bots), using
# the matching app-scoped token the release pipeline already deploys with; adds nothing to the
# automatic push-to-main path. Gated by the `autonomy-ops` GitHub Environment's required reviewers
# (configured once in the repo's Settings, not expressible in this file — see
# docs/AUTONOMY-DEPLOY.md).
#
# Bot Alpaca credentials are NOT set here (removed 2026-09-04, #1180 slice F): a bot's key is added
# and rotated in the app exactly like a human's — Settings → Account → <bot> → Rotate, owner-only —
# and the bots process pulls it over the controls bridge within one 30s poll, no restart
# (src/autonomous/bot-credentials-client.ts, proven live 2026-09-04). The roster lives in
# fly.bots.toml's [env] (SKYNET_AUTONOMOUS_BOTS). The env-var credential path is break-glass only,
# reachable from a terminal (`flyctl secrets set`), never from a button.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        required: true
        type: choice
        options:
          - status
          - machine-status
          - logs
          - bootstrap-bots-app
          - flip-mode
          - set-playbooks
          - set-beta-forcing
          - set-hardcore
      target_app:
        description: >-
          Which Fly app to operate on. After the deploy split the bots fleet lives in
          skynet-capital-bots (the default); skynet-capital remains selectable for the transition
          window while the old shared-app bots group still exists.
        required: true
        type: choice
        options:
          - skynet-capital-bots
          - skynet-capital
        default: skynet-capital-bots
      mode:
        description: "observe or live — only read by flip-mode"
        required: false
        type: choice
        options:
          - observe
          - live
        default: observe
      playbooks:
        description: >-
          Playbook roster, "id:mode" pairs — only read by set-playbooks. Empty string = all
          playbooks dark. e.g. "S1-NVDA:standard,G1-GOOG:conservative". Valid ids/modes are
          enforced at boot (src/playbooks/registry.ts refuses unknown tokens loudly).
        required: false
        type: string
        default: ""
      beta_forcing:
        description: >-
          Beta-phase forced-pick count — only read by set-beta-forcing. Empty or "0" = dark. When
          armed, and nothing organic trades on a given day, forces up to N small, honestly-labeled
          BETA-SCOUT picks (see src/playbooks/beta-scout.ts). Eric's beta-phase directive: "2-3".
        required: false
        type: string
        default: ""
      hardcore_bots:
        description: >-
          Comma-separated persona ids for HARDCORE research mode — only read by set-hardcore.
          Empty string = hardcore dark. Unknown ids are refused loudly at boot
          (src/personas/registry.ts). Currently built: sauron.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  autonomy-ops:
    name: autonomy ops · ${{ inputs.action }} · ${{ inputs.target_app }}
    runs-on: ubuntu-latest
    # The actual allowlist: the `autonomy-ops` GitHub Environment (Settings -> Environments), with
    # required reviewers + "protected branches only" deployment restriction. Verified live — a
    # workflow_dispatch run sits in "Waiting" until an allowlisted reviewer approves it. Note:
    # required-reviewer environment protection needs a public repo or a paid plan on a private one.
    environment: autonomy-ops
    env:
      TARGET_APP: ${{ inputs.target_app }}
    steps:
      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          # Pinned (2026-09-05, docs/LESSONS.md): `latest` is resolved through an unauthenticated
          # releases call that 403s under runner load; a pinned version downloads a fixed asset.
          version: 0.4.99

      - name: Status — secret NAMES only, values are never shown or settable this way
        if: ${{ inputs.action == 'status' }}
        run: flyctl secrets list -a "$TARGET_APP"
        env:
          FLY_API_TOKEN: ${{ inputs.target_app == 'skynet-capital-bots' && secrets.FLY_API_TOKEN_BOTS || secrets.FLY_ORG_TOKEN || secrets.FLY_API_TOKEN }}

      - name: Machine status — is the process actually up, not just configured
        if: ${{ inputs.action == 'machine-status' }}
        run: |
          flyctl status -a "$TARGET_APP"
          echo "---"
          flyctl machine list -a "$TARGET_APP" --json \
            | jq '[.[] | {id, state, region, updated_at: .updated_at}]'
        env:
          FLY_API_TOKEN: ${{ inputs.target_app == 'skynet-capital-bots' && secrets.FLY_API_TOKEN_BOTS || secrets.FLY_ORG_TOKEN || secrets.FLY_API_TOKEN }}

      - name: Logs — recent buffer, no streaming (this runner exits, it can't tail forever)
        # Every mode/roster action above tells the operator to go check `fly logs` by hand from a
        # terminal — this is that check, self-serve, without one. `--no-tail` dumps the recent
        # buffer and exits instead of streaming (this job has no interactive session to Ctrl-C).
        if: ${{ inputs.action == 'logs' }}
        run: flyctl logs -a "$TARGET_APP" --no-tail | tail -300
        env:
          FLY_API_TOKEN: ${{ inputs.target_app == 'skynet-capital-bots' && secrets.FLY_API_TOKEN_BOTS || secrets.FLY_ORG_TOKEN || secrets.FLY_API_TOKEN }}

      - name: Bootstrap the bots app — create skynet-capital-bots on the default org network
        # App creation is org-level, so this prefers FLY_ORG_TOKEN — but it FALLS BACK to the
        # long-standing FLY_API_TOKEN so "maybe my existing token is org-capable" is a free,
        # phone-clickable experiment (Eric, 2026-08-26): an app-scoped token fails the very first
        # call loudly with nothing created, and the error names the laptop fix. Idempotent: an app
        # that already exists is reported, not an error. Never passes --network: a custom network
        # would silently sever the bots↔dashboard controls bridge (fly.bots.toml).
        if: ${{ inputs.action == 'bootstrap-bots-app' }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::No Fly token available (FLY_ORG_TOKEN or FLY_API_TOKEN). Mint one from a terminal — fly tokens create deploy -o personal — and add it as FLY_ORG_TOKEN under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          if flyctl status -a skynet-capital-bots >/dev/null 2>&1; then
            echo "skynet-capital-bots already exists — nothing to create."
          elif flyctl apps create skynet-capital-bots --org personal; then
            echo "Created. Next: add Sauron's Alpaca paper key in the app (Settings -> Account -> Sauron -> Rotate), set-hardcore if wanted, then Pipeline -> force_bots_deploy to stand the machine up in observe."
          else
            echo "::error::App creation was refused — the available token is app-scoped, not org-capable. The laptop fix (once): fly tokens create deploy -o personal, then add the output as repo secret FLY_ORG_TOKEN and re-run this button. Nothing was created or changed."
            exit 1
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_ORG_TOKEN || secrets.FLY_API_TOKEN }}

      - name: Set playbook roster
        if: ${{ inputs.action == 'set-playbooks' }}
        # PLAYBOOKS is passed via env and read as a shell variable ($PLAYBOOKS), never
        # interpolated directly into the script via ${{ }} — this is the only free-text
        # (type: string) input in this workflow (every other action uses a fixed `choice`
        # dropdown GitHub validates before the job runs), so it's the one place a naive
        # ${{ inputs.playbooks }} inline substitution would be a script-injection vector.
        # Low real-world exposure (only reviewers already approved on this environment can
        # supply it) but no reason to carry the shape of the risk when this is free to avoid.
        run: |
          echo "Setting SKYNET_PLAYBOOKS=$PLAYBOOKS"
          if [ -z "$PLAYBOOKS" ]; then
            flyctl secrets unset SKYNET_PLAYBOOKS -a "$TARGET_APP" || true
            echo "Roster cleared — all playbooks dark."
          else
            flyctl secrets set "SKYNET_PLAYBOOKS=$PLAYBOOKS" -a "$TARGET_APP"
            echo "::warning::Playbooks armed. They still only ENTER on a confirmed IR print date (estimates stay dark) and only in live mode past the readiness gate. Watch fly logs -a $TARGET_APP for the [playbooks] armed line."
          fi
        env:
          FLY_API_TOKEN: ${{ inputs.target_app == 'skynet-capital-bots' && secrets.FLY_API_TOKEN_BOTS || secrets.FLY_ORG_TOKEN || secrets.FLY_API_TOKEN }}
          PLAYBOOKS: ${{ inputs.playbooks }}

      - name: Set beta-phase forcing
        if: ${{ inputs.action == 'set-beta-forcing' }}
        # BETA_FORCING passed via env and read as a shell variable, not interpolated via ${{ }} —
        # same free-text-input discipline as set-playbooks above (only reviewers already approved
        # on this environment can supply it, but there's no reason to carry the injection shape).
        run: |
          echo "Setting SKYNET_BETA_FORCING=$BETA_FORCING"
          if [ -z "$BETA_FORCING" ] || [ "$BETA_FORCING" = "0" ]; then
            flyctl secrets unset SKYNET_BETA_FORCING -a "$TARGET_APP" || true
            echo "Cleared — beta-phase forced trading stays dark."
          else
            flyctl secrets set "SKYNET_BETA_FORCING=$BETA_FORCING" -a "$TARGET_APP"
            echo "::warning::Beta-phase forcing armed at $BETA_FORCING pick(s)/day. Fires ONLY when nothing organic trades that day, sized well below every playbook's softest mode, and every pick's reason states plainly that it's a forced non-conviction fill. Watch fly logs -a $TARGET_APP for the [beta-scout] armed line."
          fi
        env:
          FLY_API_TOKEN: ${{ inputs.target_app == 'skynet-capital-bots' && secrets.FLY_API_TOKEN_BOTS || secrets.FLY_ORG_TOKEN || secrets.FLY_API_TOKEN }}
          BETA_FORCING: ${{ inputs.beta_forcing }}

      - name: Set hardcore roster
        if: ${{ inputs.action == 'set-hardcore' }}
        # HARDCORE_BOTS passed via env and read as a shell variable, not interpolated via ${{ }} —
        # same free-text-input discipline as set-playbooks/set-beta-forcing above.
        run: |
          echo "Setting SKYNET_HARDCORE_BOTS=$HARDCORE_BOTS"
          if [ -z "$HARDCORE_BOTS" ]; then
            flyctl secrets unset SKYNET_HARDCORE_BOTS -a "$TARGET_APP" || true
            echo "Cleared — hardcore research mode dark; personas run their standard builds."
          else
            flyctl secrets set "SKYNET_HARDCORE_BOTS=$HARDCORE_BOTS" -a "$TARGET_APP"
            echo "::warning::Hardcore armed for: $HARDCORE_BOTS — loosened thresholds, tranche scale-in/out, 90s cooldown (research volume). Watch fly logs -a $TARGET_APP for the [hardcore] armed line."
          fi
        env:
          FLY_API_TOKEN: ${{ inputs.target_app == 'skynet-capital-bots' && secrets.FLY_API_TOKEN_BOTS || secrets.FLY_ORG_TOKEN || secrets.FLY_API_TOKEN }}
          HARDCORE_BOTS: ${{ inputs.hardcore_bots }}

      - name: Preflight — refuse live on the bots app while the old shared-app bots group survives
        # The mechanical anti-double-trade gate for the deploy-split cutover. The boot-time
        # account-collision guard CANNOT catch this case (it only compares bots within one
        # process), so this is the only check standing between "flip the new fleet live" and two
        # processes trading the same Alpaca paper accounts. Uses the dashboard app's token
        # explicitly — this step inspects skynet-capital, whatever the target is.
        if: ${{ inputs.action == 'flip-mode' && inputs.mode == 'live' && inputs.target_app == 'skynet-capital-bots' }}
        run: |
          COUNT=$(flyctl machine list -a skynet-capital --json \
            | jq '[.[] | select(.config.metadata.fly_process_group == "bots")] | length')
          if [ "$COUNT" != "0" ]; then
            echo "::error::skynet-capital still runs $COUNT machine(s) in its bots process group — going live on skynet-capital-bots now could double-trade the same Alpaca accounts. Merge the cutover PR (it removes the group from fly.toml), destroy any survivors (fly machine destroy), then re-run."
            exit 1
          fi
          echo "old bots group is gone — safe to flip live."
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Flip autonomous mode
        if: ${{ inputs.action == 'flip-mode' }}
        run: |
          echo "Setting SKYNET_AUTONOMOUS_MODE=${{ inputs.mode }}"
          flyctl secrets set "SKYNET_AUTONOMOUS_MODE=${{ inputs.mode }}" -a "$TARGET_APP"
          if [ "${{ inputs.mode }}" = "live" ]; then
            echo "::warning::LIVE — bots will begin placing PAPER orders once the market is open and their readiness gate passes. Watch fly logs -a $TARGET_APP for the [gate]/[order] lines."
          fi
        env:
          FLY_API_TOKEN: ${{ inputs.target_app == 'skynet-capital-bots' && secrets.FLY_API_TOKEN_BOTS || secrets.FLY_ORG_TOKEN || secrets.FLY_API_TOKEN }}

