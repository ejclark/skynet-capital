name: Claude

# Layer 3 of the design→code pickup (docs/HANDOFFS.md) — and the only genuinely event-driven one:
# an `@claude` mention on an issue or comment starts a Claude Code session in seconds, with no
# polling. The handoff watcher (handoff-detect.yml) writes exactly that mention, so the chain is
# push → issue → session.
#
# INERT UNTIL ERIC ARMS IT. This needs two things only he can do (the irreversible class —
# credentials are never self-authorized):
#   1. Install the Claude Code GitHub App on this repo — https://github.com/apps/claude
#   2. Add repository secret CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`)
# Until then the `gate` job reports disabled and the run costs one trivial step. The hourly handoff
# Routine carries the load in the meantime, at ≤1h latency instead of seconds.
#
# Why the two-job shape: GitHub does not expose the `secrets` context to a job-level `if`, so the
# "is it armed?" check has to happen in a step (where secrets ARE available) and be passed on as a
# job output. The cheap `github`-context filters live on the gate job's own `if`, so an ordinary
# issue or comment with no @claude in it never starts a runner at all.

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  gate:
    name: armed?
    # Cheap filters first (github context only): something has to actually say @claude, and Claude's
    # own comments must not re-trigger it.
    if: >-
      ${{ (contains(github.event.issue.body, '@claude') ||
           contains(github.event.comment.body, '@claude')) &&
          github.event.comment.user.login != 'claude[bot]' }}
    runs-on: ubuntu-latest
    outputs:
      armed: ${{ steps.check.outputs.armed }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "armed=true" >> "$GITHUB_OUTPUT"
          else
            echo "armed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Claude Code app is not armed (no CLAUDE_CODE_OAUTH_TOKEN secret). The hourly handoff Routine will pick this up instead — see docs/HANDOFFS.md."
          fi

  claude:
    name: claude
    needs: gate
    if: needs.gate.outputs.armed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
