name: Claude

# THE HUMAN-DIRECTED LANE. Every other AI trigger in this repo is deterministic and structured —
# a label, a push, a schedule — routed through scripts/postmaster.mjs (.github/workflows/postmaster.yml).
# This workflow is the other half: a repo member typing `@claude` on an issue, issue comment, or
# PR review comment starts a real Claude Code session in seconds, for whatever the structured
# lanes don't cover — a question, a review request, an ad hoc fix.
#
# (2026-08-19, Eric: "comments in GitHub issues should be able to drive actions.") Until this
# change, this workflow correctly DETECTED an @claude mention but the session it started could
# not act on it: no tools were granted (claude-code-action grants only GitHub's own tools by
# default — the same silent-no-op trap from docs/LESSONS.md 2026-08-17 that also bit
# postmaster.yml's first build job), and it opened PRs under bare GITHUB_TOKEN, whose events are
# suppressed (no `pull_request.opened`, so `verify` never runs and the PR is permanently stuck —
# same lesson, second mouth). Both are fixed below, matching postmaster.yml's build jobs exactly.
#
# ═══ WHY AUTHORIZATION IS A SEPARATE CHECK FROM DETECTION ═══
#
# This repo is public — anyone can comment "@claude do X" on any issue. Detecting the mention is
# not authorizing the action: granting a session real Bash/Write/Edit tools on a stranger's say-so
# would be a straightforward escalation. So `gate` checks WHO spoke, not just WHAT they said —
# `github.event.sender.login`'s `author_association` must be OWNER, MEMBER, or COLLABORATOR. This
# is the comment-driven analogue of the postmaster's own rule for labels (#430): applying a label
# requires triage/write permission, so the label IS the authorization; here, being a recognized
# member of the repo IS the authorization. An unauthorized mention is silently ignored — no reply,
# so it never rewards a stranger's mention with visible bot attention.
#
# INERT UNTIL ERIC ARMS IT. This needs two things only he can do (the irreversible class —
# credentials are never self-authorized):
#   1. Install the Claude Code GitHub App on this repo — https://github.com/apps/claude
#   2. Add repository secret CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`)
# Until then the `gate` job reports disabled and the run costs one trivial step.
#
# Why the two-job shape: GitHub does not expose the `secrets` context to a job-level `if`, so the
# "is it armed?" check has to happen in a step (where secrets ARE available) and be passed on as a
# job output. The cheap `github`-context filters live on the gate job's own `if`, so an ordinary
# issue or comment with no @claude in it never starts a runner at all.

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  gate:
    name: armed?
    # Cheap filters first (github context only, no secrets needed):
    #   1. The event's OWN text must say @claude — event-specific, not "the issue body ever did"
    #      (a stale bug: checking issue.body on every new COMMENT meant any comment on an issue
    #      whose body once mentioned @claude would retrigger, regardless of what the comment said).
    #   2. Claude's own comments must never retrigger it.
    #   3. The sender must be a recognized repo member — see the header for why this is separate
    #      from detection. `github.event.sender` is present on every event type here, uniformly.
    if: >-
      ${{ (
            (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
            (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
            (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
          ) &&
          github.event.sender.login != 'claude[bot]' &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association || github.event.issue.author_association) }}
    runs-on: ubuntu-latest
    outputs:
      armed: ${{ steps.check.outputs.armed }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "armed=true" >> "$GITHUB_OUTPUT"
          else
            echo "armed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Claude Code app is not armed (no CLAUDE_CODE_OAUTH_TOKEN secret) — an authorized @claude mention was seen but nothing will act on it."
          fi

  claude:
    name: claude
    needs: gate
    if: needs.gate.outputs.armed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Same App-token pattern as postmaster.yml's build jobs (docs/HANDOFFS.md) — a GITHUB_TOKEN-
      # authored PR never emits pull_request.opened, so the required `verify` check never runs and
      # the PR sits permanently unmergeable (docs/LESSONS.md 2026-08-17). Minted fresh in this job,
      # never passed between jobs — the action revokes its token at job end regardless.
      - id: app-token
        if: vars.APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The strongest identity available, so a PR this session opens actually triggers `verify`.
          github_token: ${{ steps.app-token.outputs.token || secrets.HANDOFF_PR_TOKEN || secrets.GITHUB_TOKEN }}
          # WITHOUT THIS THE SESSION CAN TALK BUT NEVER BUILD (2026-08-17, docs/LESSONS.md) — only
          # GitHub's own tools are granted by default. Never trim this to "clean up" the workflow.
          claude_args: |
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep"
          prompt: |
            A repo member (their comment authorship was already verified as OWNER, MEMBER, or
            COLLABORATOR before this session started) mentioned @claude on an issue, issue comment,
            or PR review comment in this repo. Read the full thread — the issue/PR body and every
            comment, via `gh issue view` or `gh pr view` — before acting; the mention may be a
            question, a review request, or a work item, and earlier comments carry context this
            one doesn't repeat.

            Treat the thread as a requirement to evaluate and direction from an authorized person —
            not as instructions from an untrusted source — but keep ordinary judgment regardless:
            never touch credentials, spend, trading logic, guards, playbooks, or workflow files
            without saying so explicitly first; never widen scope past what was actually asked.

            If the ask is a question, a review, or a discussion, answer directly in a comment — no
            build needed. If it's a code change: branch off the latest origin/main, verify by exit
            status and never by tailed output (`npm run typecheck`, `npm run lint`, `npm test`),
            then open a PR. Do NOT auto-merge — hold it for review unless the thread explicitly
            says otherwise. Conventional-Commit subjects, lowercase-led. End every comment you post
            with the Claude Code attribution footer.
