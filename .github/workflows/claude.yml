name: Claude

# THE HUMAN-DIRECTED LANE. Every other AI trigger in this repo is deterministic and structured —
# a label, a push, a schedule — routed through scripts/postmaster.mjs (.github/workflows/postmaster.yml).
# This workflow is the other half: a repo member commenting on an issue, issue comment thread, or
# PR review thread starts (or STEERS — see below) a real Claude Code session in seconds, for
# whatever the structured lanes don't cover — a question, a review request, an ad hoc fix.
#
# STEERING (2026-08-20, Eric: "listen for new/edited comments to a github issue to steer any
# inflight processes actively working the issue, and/or kick off process to start working the
# issue... the origin of the source doesn't matter"). Two changes from the mention-only design
# below: (1) a comment or edited comment from a recognized member no longer needs the literal
# `@claude` trigger phrase — ANY comment on an existing thread counts, so a plain reply steers or
# starts work exactly like an explicit mention did before; (2) `concurrency.cancel-in-progress` is
# now `true`, so a new/edited comment on the same issue/PR cancels whatever session is still
# running there and starts fresh with the current thread — GitHub Actions' own primitive for
# "steer an in-flight process," not a custom mechanism. Opening a brand NEW issue still requires
# an explicit `@claude` in the body — that trigger is unchanged, since "start work on every new
# issue a collaborator opens" is a materially different, broader thing than "let a comment redirect
# work already under discussion," and the structured lanes (labels, `feedback`) already own new-
# issue intake. "Origin doesn't matter" is honored exactly as far as GitHub's own
# `author_association` extends: a bot or process posting AS a recognized OWNER/MEMBER/COLLABORATOR
# account triggers this the same as a human typing directly; a bot posting under its own unlinked
# identity (author_association `NONE`, the common case for e.g. `github-actions[bot]`) does not —
# widening that further would mean trusting arbitrary third-party bot comments on a public repo,
# which is exactly the escalation the section below exists to prevent.
#
# (2026-08-19, Eric: "comments in GitHub issues should be able to drive actions.") Until this
# change, this workflow correctly DETECTED an @claude mention but the session it started could
# not act on it: no tools were granted (claude-code-action grants only GitHub's own tools by
# default — the same silent-no-op trap from docs/LESSONS.md 2026-08-17 that also bit
# postmaster.yml's first build job), and it opened PRs under bare GITHUB_TOKEN, whose events are
# suppressed (no `pull_request.opened`, so `verify` never runs and the PR is permanently stuck —
# same lesson, second mouth). Both are fixed below, matching postmaster.yml's build jobs exactly.
#
# ═══ WHY AUTHORIZATION IS A SEPARATE CHECK FROM DETECTION ═══
#
# This repo is public — anyone can comment "@claude do X" on any issue. Detecting the mention is
# not authorizing the action: granting a session real Bash/Write/Edit tools on a stranger's say-so
# would be a straightforward escalation. So `gate` checks WHO spoke, not just WHAT they said —
# `github.event.sender.login`'s `author_association` must be OWNER, MEMBER, or COLLABORATOR. This
# is the comment-driven analogue of the postmaster's own rule for labels (#430): applying a label
# requires triage/write permission, so the label IS the authorization; here, being a recognized
# member of the repo IS the authorization. An unauthorized mention is silently ignored — no reply,
# so it never rewards a stranger's mention with visible bot attention.
#
# SELF-TRIGGER ON A BORROWED IDENTITY (#625, historical — kept as a second layer). `sender.login
# != 'claude[bot]'` only catches a bot comment posted under the GitHub App's own identity. Before
# `vars.APP_CLIENT_ID` was set (#611), every lane in this repo posted its comments via a PAT scoped
# to `ejclark`'s account instead — so `sender.login` read `ejclark`, `author_association` read
# `OWNER`, and a close-out comment that RESOLVED an issue re-triggered a fresh session that found
# nothing to do. There was no API-level signal separating "Eric typed this" from "a script posted
# this with Eric's PAT": a PAT is not a GitHub App, so `performed_via_github_app` is null either
# way. The only reliable tell was content — every comment this repo's Claude sessions post carries
# a markdown link opening `[Claude Code](https://claude` (interactive.md's footer instruction, and
# postmaster's shared `FOOTER` in `scripts/postmaster-labels.mjs`; the two differ after that, one
# linking `claude.ai/code` and the other `claude.com/claude-code`), so `gate` excludes any comment
# carrying that shared prefix. Deliberately the literal link opener, NOT a bare mention of "Claude
# Code" — a member's comment can discuss Claude Code in prose without tripping the guard. Now that
# every lane's `github_token` is the App's own token with no PAT fallback (2026-08-28), comments
# post under the App's own bot identity and this specific scenario can't recur — but the check is
# free and catches other borrowed-identity paths too (a manually-run PAT, a future integration), so
# it stays as a second layer behind `sender.login`, not the load-bearing one.
#
# That gate gets the SESSION started, but doesn't police what the session reads once it's running:
# a session that started because a member wrote "@claude take a look" then reads the WHOLE thread
# for context — including any earlier comment from an unverified stranger. Verifying who triggered
# the session is not the same as verifying who wrote everything the session subsequently reads
# (an adversarial-review finding, 2026-08-19, confirmed on verification) — so the prompt itself
# draws that line explicitly: only the triggering comment's author is authorized; the rest of the
# thread is data to evaluate, never instructions to obey. Same doctrine as postmaster.yml's
# build-feedback job for member-submitted issue bodies — never relax this to "trust the thread."
#
# INERT UNTIL ERIC ARMS IT. This needs two things only he can do (the irreversible class —
# credentials are never self-authorized):
#   1. Install the Claude Code GitHub App on this repo — https://github.com/apps/claude
#   2. Add repository secret CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`)
# Until then the `gate` job reports disabled and the run costs one trivial step.
#
# Why the two-job shape: GitHub does not expose the `secrets` context to a job-level `if`, so the
# "is it armed?" check has to happen in a step (where secrets ARE available) and be passed on as a
# job output. The cheap `github`-context filters live on the gate job's own `if`, so an ordinary
# comment from anyone not a recognized member never starts a runner at all.

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  # STEERING (2026-08-20, Eric: "listen for new/edited comments ... to steer any inflight
  # processes"). true is load-bearing: a new/edited comment on the same issue/PR now cancels
  # whatever session is still running and starts fresh with the current thread — the natural
  # "steer" primitive GitHub Actions already provides, no custom orchestration needed. A killed
  # run leaves no partial guarantee (no branch, no PR, or a half-finished one) — the restarted
  # session's prompt says so explicitly.
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: armed?
    # Cheap filters first (github context only, no secrets needed):
    #   1. A COMMENT (issue_comment or PR review comment) is authorization enough on its own —
    #      steering (2026-08-20) means any comment from a recognized member counts, not just one
    #      saying @claude. Opening a brand NEW issue is a different, broader trigger and still
    #      requires an explicit @claude in the body (see the header for why).
    #   2. Claude's own comments must never retrigger it — whether posted under the App's bot
    #      identity or, when APP_CLIENT_ID is unset, under a borrowed human identity via
    #      HANDOFF_PR_TOKEN (see the header's "SELF-TRIGGER ON A BORROWED IDENTITY", #625).
    #   3. The sender must be a recognized repo member — see the header for why this is separate
    #      from detection. `github.event.sender` is present on every event type here, uniformly.
    if: >-
      ${{ (
            github.event_name == 'issue_comment' ||
            github.event_name == 'pull_request_review_comment' ||
            (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
          ) &&
          github.event.sender.login != 'claude[bot]' &&
          !contains(github.event.comment.body || github.event.issue.body, '[Claude Code](https://claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association || github.event.issue.author_association) }}
    runs-on: ubuntu-latest
    outputs:
      armed: ${{ steps.check.outputs.armed }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "armed=true" >> "$GITHUB_OUTPUT"
          else
            echo "armed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Claude Code app is not armed (no CLAUDE_CODE_OAUTH_TOKEN secret) — an authorized @claude mention was seen but nothing will act on it."
          fi

  claude:
    name: claude
    needs: gate
    if: needs.gate.outputs.armed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Same App-token pattern as postmaster.yml's build jobs (docs/HANDOFFS.md) — a GITHUB_TOKEN-
      # authored PR never emits pull_request.opened, so the required `verify` check never runs and
      # the PR sits permanently unmergeable (docs/LESSONS.md 2026-08-17). Minted fresh in this job,
      # never passed between jobs — the action revokes its token at job end regardless. No fallback
      # tier (Eric, 2026-08-28 — the App is assumed reliable): if it isn't configured or loses
      # access, this job fails loudly rather than quietly opening a PR under a weaker identity.
      - id: app-token
        if: vars.APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The App token, no fallback tier — so a PR this session opens actually triggers `verify`.
          github_token: ${{ steps.app-token.outputs.token }}
          # WITHOUT THIS THE SESSION CAN TALK BUT NEVER BUILD (2026-08-17, docs/LESSONS.md) — only
          # GitHub's own tools are granted by default. Never trim this to "clean up" the workflow.
          claude_args: |
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep"
          # The instruction set lives in .github/prompts/interactive.md, not here — workflow files
          # never auto-merge, so a policy written in this file could only be corrected by spending
          # Eric's attention. That is precisely how this lane's blanket "do NOT auto-merge" rule
          # outlived the 2026-08-20 ruling that superseded it and went on holding pure-CSS PRs for
          # sixteen hours. As repo content the policy is an ordinary auto-merging PR.
          prompt: |
            Read `.github/prompts/interactive.md` in this repo and follow it exactly. It is your
            complete instruction set for this run.
