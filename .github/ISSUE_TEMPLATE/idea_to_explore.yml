name: "💡 Idea to explore"
description: "A bigger, open-ended idea or direction — half-formed is totally fine."
title: "[idea] "
labels: ["idea", "feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Blue-sky welcome. This is the place for "what if…" — no need to have it figured out.
        We'll explore it together, and the best ones become real.

        **Title tip:** one clear sentence — *"Bots explain each closed play in a line"*. Half-formed is fine; vague titles are what get lost.

        **What happens next:** once this is triaged, an AI build session picks it up fresh — everything it
        knows about your idea is what's written here. Progress shows up as comments on this issue.
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What's the concept? Rough is good.
      placeholder: "What if each bot explained its trade in one plain-English sentence after a play closes?"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What might it make better?
      description: Who's it for, and what does it help them do, learn, or enjoy?
      placeholder: "I'd actually learn *why* a play was picked, instead of just seeing it happen."
    validations:
      required: false
  - type: textarea
    id: inspiration
    attributes:
      label: What sparked it?
      description: A moment in the app, something you saw elsewhere, a wish…
      placeholder: "Watched a play close and really wanted to know the bot's reasoning."
    validations:
      required: false
  - type: textarea
    id: done-looks-like
    attributes:
      label: If this existed, what would you see?
      description: Paint the picture — one concrete moment of using it. It's the single best steer you can give the builder.
      placeholder: "A play closes, and under it a line appears: 'Sold the spread — IV crushed after earnings, the edge was gone.'"
    validations:
      required: false
