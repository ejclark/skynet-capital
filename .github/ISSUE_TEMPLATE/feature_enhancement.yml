name: "✨ Feature / enhancement"
description: "A concrete improvement to something that already exists."
title: "[enhancement] "
labels: ["enhancement", "feedback"]
body:
  - type: markdown
    attributes:
      value: "Got an idea to make an existing part of Skynet Capital better? Tell us the what and the why."
  - type: textarea
    id: what
    attributes:
      label: What would you like to see?
      description: Describe the improvement.
      placeholder: "Let me pin a favorite play to the top of the playbook…"
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: What does it make easier, clearer, or more fun?
      placeholder: "I keep re-scrolling to find the iron condor…"
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: What part of the app?
      options:
        - Login / intro animation
        - The playbook / plays
        - Observatory board
        - Profiles
        - Leaderboard
        - Bots vs Humans
        - Compare
        - Onboarding / connecting an account
        - Something else
    validations:
      required: false
