name: "✨ Feature / improvement"
description: "Make something that already exists better, or add something small and concrete."
title: "[enhancement] "
labels: ["enhancement", "feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Love it — the best improvements start from a real moment of friction. Tell us the **problem first**, then your idea.
        (Big, open-ended concepts fit better under **💡 Idea to explore** — this one's for concrete tweaks.)

        **Title tip:** one clear sentence naming the outcome — *"Let me pin a favorite play to the top"*. Short beats thorough; we'll ask if we need more.

        **What happens next:** once this is triaged, an AI build session picks it up fresh — everything it
        knows about your ask is what's written here. Progress shows up as comments on this issue.
  - type: checkboxes
    id: preflight
    attributes:
      label: First checks
      options:
        - label: I skimmed the open issues and this doesn't look like a duplicate.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What's frustrating or missing right now?
      description: The problem, in your words — this matters more than the solution.
      placeholder: "I keep re-scrolling the playbook to find the iron condor; there's no way to keep my favorites handy."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
      description: Your idea for fixing it. A rough sketch or reference is welcome.
      placeholder: "Let me ⭐ a play so it pins to the top of the list."
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you're doing to work around it today?
      placeholder: "I just memorized the order."
    validations:
      required: false
  - type: textarea
    id: done-looks-like
    attributes:
      label: How would you know it's done?
      description: Finish the sentence — "I'd consider this shipped when…" It's the single best steer you can give the builder.
      placeholder: "…I can star a play and it's still pinned at the top the next time I sign in."
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: What part of the app?
      options:
        - Login / intro animation
        - The playbook / plays
        - The board (main dashboard)
        - Profiles
        - Leaderboard
        - Bots vs Humans
        - Compare
        - Onboarding / connecting an account
        - Something else / cuts across
    validations:
      required: false
