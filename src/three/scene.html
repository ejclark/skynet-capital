<!doctype html>
<meta charset="utf-8" />
<title>Barad-dûr — the Eye of Sauron</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<style>
  :root { --bg:#05070B; --accent:#35D0BA; --muted:#8B9AAB;
          --mono: ui-monospace, "JetBrains Mono", SFMono-Regular, Menlo, monospace; }
  html,body { margin:0; height:100%; background:var(--bg); overflow:hidden; }
  #c { width:100vw; height:100vh; display:block; touch-action:none; outline:none; }
  .hud { position:fixed; left:16px; bottom:14px; z-index:2; pointer-events:none;
         font:11px/1.5 var(--mono); letter-spacing:.14em; color:var(--muted); text-transform:uppercase; }
  .hud b { color:var(--accent); font-weight:600; }
</style>
<canvas id="c" aria-label="A 3D rendering of the Tower of Sauron" role="img"></canvas>
<p class="hud"><b>BARAD-DÛR</b> · sauron landmark · drag to orbit · scroll to zoom</p>
<script src="/three/scene.js"></script>
<script>
  // The bundle exposes __startTower; keep this shell dumb so all logic stays in the typed kit.
  (() => {
    var canvas = document.getElementById("c");
    if (window.__startTower) window.__startTower(canvas);
  })();
</script>
