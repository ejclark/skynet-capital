name: Design handoff pickup
# Fires when a design handoff lands in docs/handoffs/ — opens an issue that
# summons Claude Code (via anthropics/claude-code-action) to implement it.
on:
  push:
    branches: [main]
    paths: ["docs/handoffs/**"]
permissions:
  contents: read
  issues: write
jobs:
  open-handoff-issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: Find new/changed handoffs
        id: diff
        run: |
          DIRS=$(git diff --name-only HEAD^ HEAD -- docs/handoffs/ | cut -d/ -f1-3 | sort -u)
          echo "dirs<<EOF" >> "$GITHUB_OUTPUT"; echo "$DIRS" >> "$GITHUB_OUTPUT"; echo "EOF" >> "$GITHUB_OUTPUT"
      - name: Open implementation issue per handoff
        if: steps.diff.outputs.dirs != ''
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          while IFS= read -r d; do
            [ -f "$d/README.md" ] || continue
            TITLE=$(head -1 "$d/README.md" | sed 's/^# *//')
            gh issue create \
              --title "Implement: $TITLE" \
              --label "design-handoff" \
              --body "@claude A design handoff landed at \`$d\`.

          Read \`$d/README.md\` as the full spec — it is self-sufficient (contract rulings, screen anatomy, state, data requirements, implementation map). The bundled \`.dc.html\` is a DESIGN REFERENCE, not code to copy: recreate it in this repo's server-rendered TypeScript idiom.

          Work on a branch, obey the Chassis Contract rulings in the README, keep \`npm test\`, \`npm run lint\`, and \`npm run typecheck\` green, and open a PR that maps each commit to the README's implementation map."
          done <<< "${{ steps.diff.outputs.dirs }}"
# Prereq: install the Claude Code GitHub App / anthropics/claude-code-action on this
# repo so the @claude mention in the issue body triggers implementation.
