<!DOCTYPE html>
<!--
  The CT harness's page shell. Mirrors what `app/src/main.tsx` mounts into so a component renders
  against the app's real ground rather than a bare white page: one `#root`, and the shell's own
  stylesheet loaded by `index.tsx`. Playwright rewrites nothing here — this is the literal document
  every component test runs inside.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skynet Capital — component harness</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
