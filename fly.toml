app = 'skynet-capital-x6jwtw'
primary_region = 'ord'

[build]

[env]
  SKYNET_PARTICIPANT_STORE = '/data/participants.json'

[[mounts]]
  source = 'skynet_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
