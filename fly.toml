# Fly.io config for the live observatory server + the always-on autonomous bot runner.
# Two processes share one image:
#   app  — the SSE dashboard + Alpaca streams (must stay running to hold connections)
#   bots — the autonomous trader loop, so bots trade without Eric's laptop (the 24/7 problem)
# The bots process is SAFE BY DEFAULT: it runs in observe mode (decides + logs, places nothing)
# until Eric explicitly sets SKYNET_AUTONOMOUS_MODE=live. See docs/AUTONOMY-DEPLOY.md.
app = "skynet-capital"
primary_region = "ord"  # Chicago — closest to Iowa

[build]

[env]
  # Self-service accounts persist here, on the mounted volume below (survives redeploys).
  SKYNET_PARTICIPANT_STORE = "/data/participants.json"
  # Equity/realized-P/L history samples persist here too — on the volume, so history survives
  # redeploys. Without this the sampler writes inside the container and every deploy erases the
  # very history the ceremonies/deltas/trophies read (docs/LIVING-UNIVERSE.md's load-bearing layer).
  SKYNET_HISTORY_DIR = "/data/history"
  # The rest of the app's durable stores. EVERY `data/…` default in src/ is relative, so an unset
  # var writes inside the container at /app/data and every deploy erases it — silently, because an
  # absent store file is indistinguishable from an empty one. That is how the guest list kept
  # vanishing: members invited through /invite were wiped on each merge to main while the owners on
  # SKYNET_ALLOWED_EMAILS (a Fly *secret*, which persists) sailed through, so the app looked fine
  # from the inside. tests/arch/volume-persistence.spec.ts now fails CI if a new store is added
  # without a line here.
  SKYNET_ALLOWLIST_STORE = "/data/allowlist.json"
  SKYNET_CONTROLS_FILE = "/data/bot-controls.json"
  SKYNET_ACTIVITY_DIR = "/data/activity"
  SKYNET_FEEDBACK_LOG_DIR = "/data/feedback-log"
  SKYNET_ORDER_AUDIT_DIR = "/data/order-audit"
  # Training-wheels preference + claimed unlock celebrations (progression-store.ts). Earned
  # milestones are NOT here — they re-derive from the activity + order-audit ledgers on read.
  SKYNET_PROGRESSION_FILE = "/data/progression.json"
  # Owner→account links for board accounts that predate the connect form (owner-link-store.ts).
  SKYNET_OWNER_LINKS_FILE = "/data/owner-links.json"
  # Interim insight bridge (docs/plans/trade-insights-loop.md, slice 2) — the bots process has no
  # volume of its own (see [mounts] below), so it relays insight records to the app process's
  # internal-only listener (src/server/insights-listener.ts) on port 8788 — deliberately NOT in
  # [http_service] below, so it's reachable only over Fly's private 6PN network, never publicly.
  # SKYNET_INSIGHTS_DIR is where `app` appends them on the mounted volume. Both vars are read by
  # both processes but only act on the one that uses them; harmless until a caller emits records.
  SKYNET_INSIGHTS_DIR = "/data/insights"
  SKYNET_INSIGHTS_BRIDGE_URL = "http://app.process.skynet-capital.internal:8788"
  # Autonomy is OFF by default — the bots process runs but places nothing until this flips to "live".
  SKYNET_AUTONOMOUS_MODE = "observe"

[processes]
  app = "npm run serve:dashboard"
  bots = "npm run run:autonomous"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]  # only the dashboard serves HTTP; the bots process has no web port
  # Note: the app process ALSO listens on 8788 for the internal-only insight bridge (see
  # SKYNET_INSIGHTS_BRIDGE_URL above). It is intentionally absent from this block — only ports
  # declared here are forwarded by Fly's public proxy, so 8788 is unreachable from the internet.

# Persistent volume for the self-service participant store (dashboard process only — a Fly volume
# attaches to a single machine, so the bots process runs without it). Create once with:
#   fly volumes create skynet_data --region ord --size 1
[mounts]
  source = "skynet_data"
  destination = "/data"
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
