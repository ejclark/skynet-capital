# Fly.io config for the live observatory server (the DASHBOARD half of the deploy split).
# The autonomous trader loop lives in its own sibling app — fly.bots.toml / skynet-capital-bots —
# so the dashboard's every-merge deploys stop restarting the stateful bots machine (this app
# deploys on every push; the bots app only when scripts/bot-relevant.mjs says the push touched
# the bots runtime). See docs/AUTONOMY-DEPLOY.md for the split runbook and cutover procedure.
# The `app` process-group NAME below is load-bearing: it is the 6PN hostname
# app.process.skynet-capital.internal the bots app dials for the controls/insight bridge.
app = "skynet-capital"
primary_region = "ord"  # Chicago — closest to Iowa

[build]

[env]
  # Self-service accounts persist here, on the mounted volume below (survives redeploys).
  SKYNET_PARTICIPANT_STORE = "/data/participants.json"
  # Equity/realized-P/L history samples persist here too — on the volume, so history survives
  # redeploys. Without this the sampler writes inside the container and every deploy erases the
  # very history the ceremonies/deltas/trophies read (docs/LIVING-UNIVERSE.md's load-bearing layer).
  SKYNET_HISTORY_DIR = "/data/history"
  # The rest of the app's durable stores. EVERY `data/…` default in src/ is relative, so an unset
  # var writes inside the container at /app/data and every deploy erases it — silently, because an
  # absent store file is indistinguishable from an empty one. That is how the guest list kept
  # vanishing: members invited through /invite were wiped on each merge to main while the owners on
  # SKYNET_ALLOWED_EMAILS (a Fly *secret*, which persists) sailed through, so the app looked fine
  # from the inside. tests/arch/volume-persistence.spec.ts now fails CI if a new store is added
  # without a line here.
  SKYNET_ALLOWLIST_STORE = "/data/allowlist.json"
  SKYNET_CONTROLS_FILE = "/data/bot-controls.json"
  SKYNET_ACTIVITY_DIR = "/data/activity"
  SKYNET_FEEDBACK_LOG_DIR = "/data/feedback-log"
  SKYNET_ORDER_AUDIT_DIR = "/data/order-audit"
  # Owner→member account links (#546, owner-link-store.ts) — who claimed an unowned board account.
  SKYNET_OWNER_LINKS_FILE = "/data/owner-links.json"
  # Training-wheels preference + claimed unlock celebrations (progression-store.ts). Earned
  # milestones are NOT here — they re-derive from the activity + order-audit ledgers on read.
  SKYNET_PROGRESSION_FILE = "/data/progression.json"
  # Ladder-progress log (#469 slice 2, ladder-progress-log.ts) — durable per-participant record of
  # a graduated-ladder milestone completing (an OTM expiry, a first realized profit) once a
  # detector proves it. Unlike SKYNET_PROGRESSION_FILE above, a row here IS the earned truth, not a
  # claim re-derivable from another ledger — losing it on deploy would silently un-graduate a
  # member, so this is pinned rather than left EPHEMERAL the way the community track's claim-state
  # file is.
  SKYNET_LADDER_PROGRESS_DIR = "/data/ladder-progress"
  # Account playbook subscriptions (issue #885, subscription-store.ts) — which playbooks an
  # account subscribed to and the capital reserved per subscription.
  SKYNET_SUBSCRIPTIONS_FILE = "/data/playbook-subscriptions.json"
  # Interim insight bridge (docs/plans/trade-insights-loop.md, slice 2) — the bots app has no
  # volume of its own, so it relays insight records to this app's internal-only listener
  # (src/server/insights-listener.ts) on port 8788 — deliberately NOT in [http_service] below, so
  # it's reachable only over Fly's private 6PN network (org-wide — the sibling bots app is inside
  # that boundary), never publicly. SKYNET_INSIGHTS_DIR is where `app` appends them on the mounted
  # volume. The dialing side's SKYNET_INSIGHTS_BRIDGE_URL lives in fly.bots.toml — this app is the
  # listener and never dials it. SKYNET_AUTONOMOUS_MODE likewise moved to the bots app.
  SKYNET_INSIGHTS_DIR = "/data/insights"

[processes]
  app = "npm run serve:dashboard"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]  # the dashboard is this app's only process; scoping kept as documentation
  # Note: the app process ALSO listens on 8788 for the internal-only insight bridge (dialed by
  # the bots app via fly.bots.toml's SKYNET_INSIGHTS_BRIDGE_URL). It is intentionally absent from
  # this block — only ports declared here are forwarded by Fly's public proxy, so 8788 is
  # unreachable from the internet.

# Persistent volume for the self-service participant store (a Fly volume attaches to a single
# machine; the sibling bots app deliberately has none — its durable writes relay over the bridge).
# Create once with:
#   fly volumes create skynet_data --region ord --size 1
[mounts]
  source = "skynet_data"
  destination = "/data"
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
