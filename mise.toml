[tools]
# This repo's Node version for the remote session hook (.claude/hooks/session-start.sh) and local
# dev (`mise install`). A real mise.toml pin, not mise's idiomatic .nvmrc auto-detection, which is
# being deprecated upstream (warns in 2026.11.0, removed 2027.11.0). CI does NOT read this file:
# actions/setup-node can't parse mise's TOML, so .nvmrc was restored for CI (3a84d73,
# docs/LESSONS.md 2026-09-06). Bump the two together.
node = "24"
